<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>KUATO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f2eec2; --blue:#7fa3d1; --offwhite:#faf6e8;
    --navy:#123a5e; --mustard:#f6c568; --olive:#7a6a45;
    --bg:#faf6e8; --card:#ffffff; --border:#e3ddc4; --border-strong:#cfc7a3;
    --text:#123a5e; --text2:#4f5a63; --muted:#8a8570;
    --accent:#7fa3d1; --accent-dark:#4d7aad;
    --danger:#c0453b; --danger-bg:#fbe9e6;
    --success:#3a7a4f; --success-bg:#e7f3ea;
    --warn:#a66c1f; --warn-bg:#fdf1de;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Poppins',-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);}
  .app{max-width:960px;margin:0 auto;padding:24px 16px 80px;}
  .brand{font-family:'Changa One',cursive;font-weight:400;font-style:normal;letter-spacing:1px;color:var(--navy);}
  h1{font-size:24px;margin:0 0 4px;}
  h1.brand{font-size:30px;}
  h2{font-size:18px;font-weight:600;margin:0 0 12px;}
  h3{font-size:15px;font-weight:600;margin:0 0 8px;}
  p{line-height:1.6;}
  .muted{color:var(--muted);font-size:13px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  input[type=text],input[type=password],input[type=number],textarea,select{
    width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:8px;
    font-size:14px;font-family:inherit;background:#fff;color:var(--text);
  }
  textarea{resize:vertical;min-height:70px;}
  label{font-size:13px;font-weight:600;color:var(--text2);display:block;margin-bottom:4px;}
  .field{margin-bottom:12px;}
  button{
    cursor:pointer;border:1px solid var(--border-strong);background:#fff;color:var(--text);
    padding:9px 16px;border-radius:8px;font-size:14px;font-weight:500;font-family:inherit;
  }
  button:hover{background:var(--offwhite);}
  button.primary{background:var(--navy);border-color:var(--navy);color:#fff;}
  button.primary:hover{background:#0c2740;}
  button.accent{background:var(--mustard);border-color:var(--mustard);color:var(--olive);}
  button.accent:hover{background:#f2b84a;}
  button.danger{background:var(--danger-bg);border-color:#f0c4be;color:var(--danger);}
  button.danger:hover{background:#f6d6d1;}
  button.ghost{border-color:transparent;background:transparent;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  button.small{padding:5px 10px;font-size:12px;}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap;}
  .tab{padding:10px 16px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text2);border-bottom:2px solid transparent;}
  .tab.active{color:var(--navy);border-bottom-color:var(--navy);}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;}
  .pill-blue{background:#e7eff8;color:var(--accent-dark);}
  .pill-green{background:var(--success-bg);color:var(--success);}
  .pill-amber{background:var(--warn-bg);color:var(--warn);}
  .pill-gray{background:#f0ede0;color:var(--text2);}
  .list-item{padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:#fff;}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;overflow:hidden;flex-shrink:0;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .avatar-lg{width:96px;height:96px;font-size:32px;}
  .err{color:var(--danger);font-size:13px;margin-top:4px;}
  .divider{border:none;border-top:1px solid var(--border);margin:16px 0;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .qopt{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .qopt input[type=text]{flex:1;}
  img.att{max-width:100%;border-radius:8px;margin-top:8px;display:block;}
  .timer{position:fixed;top:14px;right:14px;background:var(--navy);color:#fff;padding:8px 14px;border-radius:8px;font-weight:700;font-size:15px;z-index:50;}
  .center-modal{position:fixed;inset:0;background:rgba(18,58,94,.45);display:flex;align-items:center;justify-content:center;z-index:100;}
  .modal-box{background:#fff;border-radius:12px;padding:24px;max-width:380px;width:90%;text-align:center;}
  .empty{padding:30px;text-align:center;color:var(--muted);font-size:14px;}
  .login-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-direction:column;}
  .login-card{width:100%;max-width:340px;}
  .badge-score{font-size:26px;font-weight:700;color:var(--navy);}
  .clickable{cursor:pointer;}
  .chipbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .metric{background:var(--offwhite);border-radius:var(--radius);padding:16px;text-align:center;}
  .metric .num{font-size:28px;font-weight:700;color:var(--navy);}
  .metric .lbl{font-size:12px;color:var(--muted);margin-top:2px;}
  .fileRow{display:flex;flex-direction:column;gap:6px;}
  .studentRow{padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:#fff;}
  .actionbar{display:flex;gap:6px;flex-wrap:wrap;}

  @media (max-width:600px){
    .app{padding:14px 10px 70px;}
    .card{padding:14px;}
    .header{gap:8px;}
    h1.brand{font-size:22px;}
    .header h1.brand{font-size:17px;}
    .tabs{gap:0;}
    .tab{padding:8px 10px;font-size:13px;}
    .grid2{grid-template-columns:1fr;}
    .row-between{flex-direction:column;align-items:stretch;}
    .row-between > div{width:100%;}
    .list-item,.studentRow{padding:12px;}
    .list-item .row, .studentRow .row, .actionbar{width:100%;}
    .list-item button, .studentRow button, .actionbar button{flex:1;min-width:0;}
    button{padding:10px 14px;font-size:14px;}
    .timer{top:8px;right:8px;font-size:13px;padding:6px 10px;}
    .modal-box{padding:18px;}
  }
</style>
</head>

<script>
/* ---------- Almacenamiento ---------- */
const DB_KEY = 'kuato_db_v1';
let DB = null;

function defaultDB(){
  return {
    users: {
      'maestro': { password:'maestro123', role:'teacher', name:'Profesor(a)', photo:'' }
    },
    board: { text: 'Bienvenidos al curso. Aqui encontraran informacion importante.', images: [] },
    categories: []
  };
}

async function loadDB(){
  try{
    const snap = await FIRESTORE_DOC.get();
    if(snap.exists && snap.data() && snap.data().json){
      DB = JSON.parse(snap.data().json);
    }else{
      DB = defaultDB();
      await saveDB();
    }
  }catch(e){
    console.error('Error cargando datos de Firebase', e);
    DB = defaultDB();
  }
  if(!DB.users) DB.users = defaultDB().users;
  if(!DB.board) DB.board = defaultDB().board;
  if(!DB.categories) DB.categories = [];
  Object.values(DB.users).forEach(u=>{ if(u.photo===undefined) u.photo=''; });
}

async function saveDB(){
  try{
    await FIRESTORE_DOC.set({ json: JSON.stringify(DB) });
  }catch(e){
    console.error('Error guardando datos en Firebase', e);
    alert('No se pudo guardar en la base de datos. Revisa tu configuracion de Firebase y tu conexion a internet.');
  }
}

function uid(){ return Math.random().toString(36).slice(2,10); }

const MAX_IMAGE_BYTES = 700*1024;
function handleImageFile(file, onDone){
  if(!file) return;
  if(!file.type.startsWith('image/')){ alert('Selecciona un archivo de imagen valido.'); return; }
  if(file.size > MAX_IMAGE_BYTES){ alert('La imagen es muy pesada. Usa una menor a 700 KB para que se pueda guardar.'); return; }
  const reader = new FileReader();
  reader.onload = ()=> onDone(reader.result);
  reader.onerror = ()=> alert('No se pudo leer la imagen.');
  reader.readAsDataURL(file);
}

function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(()=> fallbackCopy(text));
  }else{
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

/* ---------- Estado de sesion ---------- */
let session = null;
let view = 'login';
let teacherTab = 'info';
let studentTab = 'info';
let editingCategoryId = null;
let editingActivity = null;
let takingActivity = null;
let examAccepted = false;
let examTimerInterval = null;
let examTimeLeft = 0;
let resultView = null;
let loginError = '';
let profileMsg = '';
let profileErr = '';
let editingStudent = null;
let bulkMsg = '';

const root = document.getElementById('root');

/* ---------- Utilidades de datos ---------- */
function findCategory(id){ return DB.categories.find(c=>c.id===id); }
function findActivity(catId, actId){
  const c = findCategory(catId);
  if(!c) return null;
  return c.activities.find(a=>a.id===actId);
}
function studentsList(){
  return Object.entries(DB.users).filter(([u,d])=>d.role==='student').map(([u,d])=>({username:u,...d}));
}
function activityTotalPoints(act){
  return act.questions.reduce((s,q)=>s+(Number(q.points)||0),0);
}
function bestSubmission(act, username){
  const subs = (act.submissions && act.submissions[username]) || [];
  if(subs.length===0) return null;
  return subs.reduce((best,s)=> s.score>best.score? s: best, subs[0]);
}
function globalGrade(username){
  let earned=0, possible=0;
  DB.categories.forEach(cat=>{
    cat.activities.forEach(act=>{
      if(!act.assignedTo || !act.assignedTo.includes(username)) return;
      const subs = (act.submissions && act.submissions[username]) || [];
      if(subs.length===0) return;
      const s = act.type==='work' ? bestSubmission(act, username) : subs[0];
      earned += s.score;
      possible += activityTotalPoints(act);
    });
  });
  if(possible===0) return null;
  return { earned, possible, pct: Math.round((earned/possible)*100) };
}

/* ---------- Render principal ---------- */
function render(){
  root.innerHTML = '';
  if(examTimerInterval && !takingActivity){ clearInterval(examTimerInterval); examTimerInterval=null; }

  if(!session){ renderLogin(); return; }
  if(takingActivity){ renderTakingActivity(); return; }
  if(resultView){ renderResult(); return; }
  if(session.role==='teacher') renderTeacher();
  else renderStudent();
}

/* ---------- Login ---------- */
function renderLogin(){
  const wrap = el('div',{class:'login-wrap'});
  wrap.appendChild(el('h1',{class:'brand'},'KUATO'));
  const card = el('div',{class:'card login-card'});
  card.appendChild(el('p',{class:'muted'},'Inicia sesion con tu usuario y contrasena.'));

  const userField = el('div',{class:'field'});
  userField.appendChild(el('label',{},'Usuario'));
  const userInput = el('input',{type:'text',id:'login-user'});
  userField.appendChild(userInput);

  const passField = el('div',{class:'field'});
  passField.appendChild(el('label',{},'Contrasena'));
  const passInput = el('input',{type:'password',id:'login-pass'});
  passField.appendChild(passInput);

  card.appendChild(userField);
  card.appendChild(passField);

  if(loginError) card.appendChild(el('div',{class:'err'}, loginError));

  const btn = el('button',{class:'primary',style:'width:100%;margin-top:6px;'},'Entrar');
  btn.onclick = ()=>{
    const u = userInput.value.trim();
    const p = passInput.value;
    const rec = DB.users[u];
    if(!rec || rec.password !== p){ loginError = 'Usuario o contrasena incorrectos.'; render(); return; }
    loginError='';
    session = { username:u, role:rec.role, name:rec.name || u };
    saveSession();
    teacherTab='info'; studentTab='info';
    render();
  };
  card.appendChild(btn);
  passInput.addEventListener('keydown', e=>{ if(e.key==='Enter') btn.click(); });

  wrap.appendChild(card);
  root.appendChild(wrap);
}

function logout(){
  session=null; loginError=''; takingActivity=null; resultView=null;
  try{ sessionStorage.removeItem('kuato_session'); }catch(e){}
  render();
}

function saveSession(){
  try{ sessionStorage.setItem('kuato_session', JSON.stringify(session)); }catch(e){}
}

function restoreSession(){
  try{
    const raw = sessionStorage.getItem('kuato_session');
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(saved && saved.username && DB.users[saved.username]){
      const rec = DB.users[saved.username];
      session = { username: saved.username, role: rec.role, name: rec.name || saved.username };
    }else{
      sessionStorage.removeItem('kuato_session');
    }
  }catch(e){}
}

/* ---------- Helpers DOM ---------- */
function el(tag, attrs={}, ...children){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c=>{
    if(c===null||c===undefined) return;
    if(typeof c==='string') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}

function avatarNode(user, size){
  const cls = 'avatar'+(size==='lg'?' avatar-lg':'');
  const a = el('div',{class:cls});
  if(user.photo){
    a.appendChild(el('img',{src:user.photo}));
  }else{
    a.textContent = (user.name||user.username||'?').slice(0,1).toUpperCase();
  }
  return a;
}

function header(title, subtitle, tabKeySetter){
  const h = el('div',{class:'header'});
  const left = el('div');
  left.appendChild(el('h1',{class:'brand',style:'font-size:20px;'},'KUATO'));
  left.appendChild(el('div',{style:'font-weight:600;margin-top:2px;'}, title));
  if(subtitle) left.appendChild(el('p',{class:'muted'}, subtitle));
  h.appendChild(left);
  const right = el('div',{class:'row'});
  const av = avatarNode(DB.users[session.username]);
  av.classList.add('clickable');
  av.onclick = ()=>{ if(session.role==='teacher') teacherTab='profile'; else studentTab='profile'; render(); };
  right.appendChild(av);
  const out = el('button',{class:'ghost small'},'Cerrar sesion');
  out.onclick = logout;
  right.appendChild(out);
  h.appendChild(right);
  return h;
}

/* ================= PERFIL (compartido) ================= */
function renderProfile(){
  const me = DB.users[session.username];
  const card = el('div',{class:'card'});
  card.appendChild(el('h2',{},'Mi perfil'));

  const top = el('div',{class:'row',style:'margin-bottom:16px;'});
  top.appendChild(avatarNode(me,'lg'));
  const info = el('div');
  info.appendChild(el('div',{style:'font-weight:600;font-size:16px;'}, me.name||session.username));
  info.appendChild(el('div',{class:'muted'}, session.role==='teacher'?'Maestro(a)':'Alumno(a)'));
  top.appendChild(info);
  card.appendChild(top);

  const photoF = el('div',{class:'field fileRow'});
  photoF.appendChild(el('label',{},'Foto de perfil'));
  const photoFile = el('input',{type:'file',accept:'image/*'});
  photoFile.onchange = ()=>{
    handleImageFile(photoFile.files[0], (dataUrl)=>{
      me.photo = dataUrl;
      saveDB();
      profileMsg = 'Foto actualizada.';
      render();
    });
  };
  photoF.appendChild(photoFile);
  const photoI = el('input',{type:'text',placeholder:'...o pega una URL de imagen'});
  photoI.value = me.photo && me.photo.startsWith('data:') ? '' : (me.photo || '');
  photoF.appendChild(photoI);
  const photoBtn = el('button',{class:'small',style:'margin-top:2px;'},'Guardar URL');
  photoBtn.onclick = ()=>{
    if(!photoI.value.trim()) return;
    me.photo = photoI.value.trim();
    saveDB();
    profileMsg = 'Foto actualizada.';
    render();
  };
  photoF.appendChild(photoBtn);
  card.appendChild(photoF);

  card.appendChild(el('hr',{class:'divider'}));

  const nameF = el('div',{class:'field'});
  nameF.appendChild(el('label',{},'Nombre para mostrar'));
  const nameI = el('input',{type:'text'});
  nameI.value = me.name || '';
  nameF.appendChild(nameI);
  card.appendChild(nameF);

  if(session.role==='teacher'){
    const userF = el('div',{class:'field'});
    userF.appendChild(el('label',{},'Nombre de usuario'));
    const userI = el('input',{type:'text'});
    userI.value = session.username;
    userF.appendChild(userI);
    card.appendChild(userF);

    const passF = el('div',{class:'field'});
    passF.appendChild(el('label',{},'Nueva contrasena (dejar en blanco para no cambiarla)'));
    const passI = el('input',{type:'password'});
    passF.appendChild(passI);
    card.appendChild(passF);

    if(profileErr) card.appendChild(el('div',{class:'err'}, profileErr));
    if(profileMsg) card.appendChild(el('div',{class:'muted',style:'color:var(--success);'}, profileMsg));

    const saveBtn = el('button',{class:'primary'},'Guardar cambios');
    saveBtn.onclick = ()=>{
      profileErr=''; profileMsg='';
      const newUser = userI.value.trim();
      const newName = nameI.value.trim();
      if(!newUser){ profileErr='El nombre de usuario no puede estar vacio.'; render(); return; }
      if(newUser !== session.username && DB.users[newUser]){ profileErr='Ese nombre de usuario ya existe.'; render(); return; }

      const rec = DB.users[session.username];
      rec.name = newName || newUser;
      if(passI.value.trim()) rec.password = passI.value.trim();

      if(newUser !== session.username){
        delete DB.users[session.username];
        DB.users[newUser] = rec;
        session.username = newUser;
      }
      session.name = rec.name;
      saveDB();
      saveSession();
      profileMsg = 'Cambios guardados.';
      render();
    };
    card.appendChild(saveBtn);
  }else{
    if(profileMsg) card.appendChild(el('div',{class:'muted',style:'color:var(--success);'}, profileMsg));
    const saveBtn = el('button',{class:'primary'},'Guardar nombre');
    saveBtn.onclick = ()=>{
      me.name = nameI.value.trim() || session.username;
      session.name = me.name;
      saveDB();
      profileMsg='Nombre actualizado.';
      render();
    };
    card.appendChild(saveBtn);

    card.appendChild(el('hr',{class:'divider'}));
    const spF = el('div',{class:'field'});
    spF.appendChild(el('label',{},'Cambiar mi contrasena'));
    const spI = el('input',{type:'password',placeholder:'Nueva contrasena'});
    spF.appendChild(spI);
    card.appendChild(spF);
    const spBtn = el('button',{},'Actualizar contrasena');
    spBtn.onclick = ()=>{
      if(!spI.value.trim()){ profileErr='Escribe una nueva contrasena.'; render(); return; }
      profileErr='';
      me.password = spI.value.trim();
      saveDB();
      profileMsg = 'Contrasena actualizada.';
      render();
    };
    card.appendChild(spBtn);
    if(profileErr) card.appendChild(el('div',{class:'err'}, profileErr));

    card.appendChild(el('hr',{class:'divider'}));
    card.appendChild(el('h3',{},'Mi calificacion global'));
    const g = globalGrade(session.username);
    if(!g){
      card.appendChild(el('div',{class:'muted'},'Aun no tienes actividades calificadas.'));
    }else{
      const grid = el('div',{class:'grid2'});
      const m1 = el('div',{class:'metric'});
      m1.appendChild(el('div',{class:'num'}, g.pct+'%'));
      m1.appendChild(el('div',{class:'lbl'},'promedio general'));
      const m2 = el('div',{class:'metric'});
      m2.appendChild(el('div',{class:'num'}, g.earned+'/'+g.possible));
      m2.appendChild(el('div',{class:'lbl'},'puntos totales'));
      grid.appendChild(m1); grid.appendChild(m2);
      card.appendChild(grid);
    }
  }

  root.appendChild(card);
}

/* ================= MAESTRO ================= */
function renderTeacher(){
  root.appendChild(header('Panel del maestro', session.name));
  const tabs = el('div',{class:'tabs'});
  const tabDefs = [['info','Informacion'],['activities','Actividades'],['students','Alumnos'],['profile','Perfil']];
  tabDefs.forEach(([key,label])=>{
    const t = el('div',{class:'tab'+(teacherTab===key?' active':'')}, label);
    t.onclick = ()=>{ teacherTab=key; editingCategoryId=null; editingActivity=null; profileMsg=''; profileErr=''; editingStudent=null; bulkMsg=''; render(); };
    tabs.appendChild(t);
  });
  root.appendChild(tabs);

  if(teacherTab==='info') renderTeacherInfo();
  else if(teacherTab==='activities') renderTeacherActivities();
  else if(teacherTab==='students') renderTeacherStudents();
  else if(teacherTab==='profile') renderProfile();
}

function renderTeacherInfo(){
  const card = el('div',{class:'card'});
  card.appendChild(el('h2',{},'Informacion visible para los alumnos'));
  card.appendChild(el('p',{class:'muted'},'Este contenido se mostrara en la sala de informacion del alumno.'));

function renderTeacherStudents(){
  const card = el('div',{class:'card'});
  card.appendChild(el('h2',{},'Agregar alumno'));
  const grid = el('div',{class:'grid2'});
  const nameF = el('div',{class:'field'}); nameF.appendChild(el('label',{},'Nombre')); const nameI = el('input',{type:'text',id:'st-name'}); nameF.appendChild(nameI);
  const userF = el('div',{class:'field'}); userF.appendChild(el('label',{},'Usuario')); const userI = el('input',{type:'text',id:'st-user'}); userF.appendChild(userI);
  const passF = el('div',{class:'field'}); passF.appendChild(el('label',{},'Contrasena')); const passI = el('input',{type:'text',id:'st-pass'}); passF.appendChild(passI);
  grid.appendChild(nameF); grid.appendChild(userF); grid.appendChild(passF);
  card.appendChild(grid);

  const errDiv = el('div',{class:'err',id:'st-err'});
  card.appendChild(errDiv);

  const addBtn = el('button',{class:'primary'},'Agregar alumno');
  addBtn.onclick = ()=>{
    const name = nameI.value.trim();
    const user = userI.value.trim();
    const pass = passI.value.trim();
    if(!name || !user || !pass){ errDiv.textContent='Completa nombre, usuario y contrasena.'; return; }
    if(DB.users[user]){ errDiv.textContent='Ese nombre de usuario ya existe.'; return; }
    DB.users[user] = { password:pass, role:'student', name, photo:'' };
    saveDB(); render();
  };
  card.appendChild(addBtn);
  root.appendChild(card);

  const bulkCard = el('div',{class:'card'});
  bulkCard.appendChild(el('h2',{},'Agregar varios alumnos a la vez'));
  bulkCard.appendChild(el('p',{class:'muted'},'Escribe un alumno por linea, separando nombre, usuario y contrasena con una coma. Ejemplo:'));
  bulkCard.appendChild(el('p',{class:'muted',style:'font-family:monospace;background:var(--offwhite);padding:8px;border-radius:6px;'},'Juan Perez, juanp, clave123\nAna Lopez, anal, clave456'));
  const bulkTa = el('textarea',{rows:6,placeholder:'Nombre, usuario, contrasena'});
  bulkCard.appendChild(bulkTa);
  const bulkErrDiv = el('div',{class:'err'});
  if(bulkMsg) bulkCard.appendChild(el('div',{class:'muted',style:'color:var(--success);'}, bulkMsg));
  const bulkBtn = el('button',{class:'primary',style:'margin-top:8px;'},'Agregar todos');
  bulkBtn.onclick = ()=>{
    bulkMsg='';
    const lines = bulkTa.value.split('\n').map(l=>l.trim()).filter(l=>l);
    let added=0, skipped=0;
    lines.forEach(line=>{
      const parts = line.split(',').map(p=>p.trim());
      if(parts.length<3 || !parts[0] || !parts[1] || !parts[2]){ skipped++; return; }
      const [name,user,pass] = parts;
      if(DB.users[user]){ skipped++; return; }
      DB.users[user] = { password:pass, role:'student', name, photo:'' };
      added++;
    });
    if(added>0) saveDB();
    bulkMsg = added+' alumno(s) agregado(s)'+(skipped>0? ', '+skipped+' linea(s) omitida(s) (usuario duplicado o formato incorrecto)':'.');
    render();
  };
  bulkCard.appendChild(bulkBtn);
  root.appendChild(bulkCard);

  const listCard = el('div',{class:'card'});
  listCard.appendChild(el('h2',{},'Alumnos registrados'));
  const students = studentsList();
  if(students.length===0){
    listCard.appendChild(el('div',{class:'empty'},'Aun no has agregado alumnos.'));
  }else{
    students.forEach(s=>{
      const item = el('div',{class:'studentRow'});

      if(editingStudent===s.username){
        const eGrid = el('div',{class:'grid2'});
        const eNameF = el('div',{class:'field'}); eNameF.appendChild(el('label',{},'Nombre'));
        const eNameI = el('input',{type:'text'}); eNameI.value=s.name; eNameF.appendChild(eNameI);
        const eUserF = el('div',{class:'field'}); eUserF.appendChild(el('label',{},'Usuario'));
        const eUserI = el('input',{type:'text'}); eUserI.value=s.username; eUserF.appendChild(eUserI);
        const ePassF = el('div',{class:'field'}); ePassF.appendChild(el('label',{},'Contrasena'));
        const ePassI = el('input',{type:'text'}); ePassI.value=s.password; ePassF.appendChild(ePassI);
        eGrid.appendChild(eNameF); eGrid.appendChild(eUserF); eGrid.appendChild(ePassF);
        item.appendChild(eGrid);
        const eErr = el('div',{class:'err'});
        item.appendChild(eErr);
        const eBar = el('div',{class:'actionbar'});
        const eSaveBtn = el('button',{class:'primary small'},'Guardar');
        eSaveBtn.onclick = ()=>{
          const newName = eNameI.value.trim();
          const newUser = eUserI.value.trim();
          const newPass = ePassI.value.trim();
          if(!newName || !newUser || !newPass){ eErr.textContent='Completa todos los campos.'; return; }
          if(newUser !== s.username && DB.users[newUser]){ eErr.textContent='Ese usuario ya existe.'; return; }
          const rec = DB.users[s.username];
          rec.name = newName; rec.password = newPass;
          if(newUser !== s.username){
            delete DB.users[s.username];
            DB.users[newUser] = rec;
            DB.categories.forEach(c=>c.activities.forEach(a=>{
              if(a.assignedTo){ a.assignedTo = a.assignedTo.map(u=>u===s.username?newUser:u); }
              if(a.submissions && a.submissions[s.username]){ a.submissions[newUser]=a.submissions[s.username]; delete a.submissions[s.username]; }
            }));
          }
          saveDB();
          editingStudent=null;
          render();
        };
        const eCancelBtn = el('button',{class:'small'},'Cancelar');
        eCancelBtn.onclick = ()=>{ editingStudent=null; render(); };
        eBar.appendChild(eSaveBtn); eBar.appendChild(eCancelBtn);
        item.appendChild(eBar);
      }else{
        const top = el('div',{class:'row-between'});
        const left = el('div',{class:'row'});
        left.appendChild(avatarNode(s));
        const info = el('div');
        info.appendChild(el('div',{style:'font-weight:600;'}, s.name));
        info.appendChild(el('div',{class:'muted'}, 'Usuario: '+s.username+'  .  Contrasena: '+s.password));
        left.appendChild(info);
        top.appendChild(left);
        item.appendChild(top);

        const bar = el('div',{class:'actionbar',style:'margin-top:8px;'});
        const editBtn = el('button',{class:'small'},'Editar');
        editBtn.onclick = ()=>{ editingStudent=s.username; render(); };
        const copyBtn = el('button',{class:'small'},'Copiar datos');
        copyBtn.onclick = ()=>{
          copyToClipboard('Nombre: '+s.name+'\nUsuario: '+s.username+'\nContrasena: '+s.password);
          copyBtn.textContent='Copiado';
          setTimeout(()=>{ copyBtn.textContent='Copiar datos'; },1500);
        };
        const rm = el('button',{class:'danger small'},'Eliminar');
        rm.onclick = ()=>{
          delete DB.users[s.username];
          DB.categories.forEach(c=>c.activities.forEach(a=>{
            if(a.assignedTo) a.assignedTo = a.assignedTo.filter(u=>u!==s.username);
            if(a.submissions) delete a.submissions[s.username];
          }));
          saveDB(); render();
        };
        bar.appendChild(editBtn); bar.appendChild(copyBtn); bar.appendChild(rm);
        item.appendChild(bar);
      }

      listCard.appendChild(item);
    });
  }
  root.appendChild(listCard);
}

function renderTeacherActivities(){
  if(editingActivity){ renderActivityEditor(); return; }
  const topCard = el('div',{class:'card'});
  topCard.appendChild(el('h2',{},'Categorias'));
  const addCatRow = el('div',{class:'row'});
  const catInput = el('input',{type:'text',placeholder:'Nombre de la nueva categoria'});
  const addCatBtn = el('button',{},'Agregar categoria');
  addCatBtn.onclick = ()=>{
    const name = catInput.value.trim();
    if(!name) return;
    DB.categories.push({id:uid(), name, activities:[]});
    saveDB(); render();
  };
  addCatRow.appendChild(catInput); addCatRow.appendChild(addCatBtn);

        el('span',{class:'pill '+(act.type==='exam'?'pill-amber':'pill-blue')}, typeLabel)));
      left.appendChild(el('div',{class:'muted'}, activityTotalPoints(act)+' pts . '+act.questions.length+' preguntas'+(act.assignedTo && act.assignedTo.length? ' . asignada a '+act.assignedTo.length+' alumno(s)':' . sin asignar')));
      item.appendChild(left);
      const btns = el('div',{class:'row'});

      const viewBtn = el('button',{class:'small'},'Entregas');
      viewBtn.onclick = ()=>{ showSubmissions(cat.id, act.id); };
      const delBtn = el('button',{class:'danger small'},'Eliminar');

      btns.appendChild(editBtn); btns.appendChild(viewBtn); btns.appendChild(delBtn);
      item.appendChild(btns);
      card.appendChild(item);
    });

    const addActRow = el('div',{class:'row',style:'margin-top:10px;'});

      editingCategoryId = cat.id;
      editingActivity = { id:uid(), name:'Nueva actividad', type:'work', timeLimitMinutes:null, questions:[], assignedTo:[], submissions:{}, __isNew:true };
      render();
    };
    addActRow.appendChild(newActBtn);
    card.appendChild(addActRow);

    root.appendChild(card);
  });
}

function showSubmissions(catId, actId){
  const act = findActivity(catId, actId);
  if(!act) return;
  const students = studentsList();
  root.innerHTML='';
  root.appendChild(header('Panel del maestro', session.name));
  const overlayHTML = el('div',{class:'card'});
  overlayHTML.appendChild(el('h2',{}, 'Entregas: '+act.name));
  const backBtn = el('button',{class:'small'},'Volver a actividades');
  backBtn.onclick = ()=>{ render(); };
  overlayHTML.appendChild(backBtn);
  overlayHTML.appendChild(el('hr',{class:'divider'}));

  const assigned = students.filter(s => act.assignedTo && act.assignedTo.includes(s.username));
  if(assigned.length===0){
    overlayHTML.appendChild(el('div',{class:'empty'},'Esta actividad no esta asignada a ningun alumno.'));
  }else{
    assigned.forEach(s=>{
      const subs = (act.submissions && act.submissions[s.username]) || [];
      const row = el('div',{class:'list-item row-between'});
      const left = el('div');
      left.appendChild(el('div',{style:'font-weight:600;'}, s.name));
      if(subs.length===0){ left.appendChild(el('div',{class:'muted'},'Sin entregar')); }
      else{
        const best = bestSubmission(act, s.username);
        left.appendChild(el('div',{class:'muted'}, subs.length+' intento(s) . mejor puntaje: '+best.score+'/'+activityTotalPoints(act)));
      }
      row.appendChild(left);
      overlayHTML.appendChild(row);
    });
  }
  root.appendChild(overlayHTML);
}

function renderActivityEditor(){
  const act = editingActivity;
  const card = el('div',{class:'card'});
  const backBtn = el('button',{class:'small'},'Volver');
  backBtn.onclick = ()=>{ editingActivity=null; render(); };
  card.appendChild(backBtn);
  card.appendChild(el('h2',{style:'margin-top:10px;'}, act.__isNew? 'Nueva actividad':'Editar actividad'));

  const nameF = el('div',{class:'field'});
  nameF.appendChild(el('label',{},'Nombre de la actividad'));
  const nameI = el('input',{type:'text'}); nameI.value = act.name;
  nameI.oninput = ()=>{ act.name = nameI.value; };
  nameF.appendChild(nameI);
  card.appendChild(nameF);

  const typeF = el('div',{class:'field'});
  typeF.appendChild(el('label',{},'Tipo de actividad'));
  const typeSel = el('select');
  typeSel.appendChild(el('option',{value:'work'},'Trabajo (hasta 3 intentos, se guarda el mejor puntaje)'));
  typeSel.appendChild(el('option',{value:'exam'},'Examen (con limite de tiempo, un intento)'));
  typeSel.value = act.type;
  typeSel.onchange = ()=>{ act.type = typeSel.value; render(); };
  typeF.appendChild(typeSel);
  card.appendChild(typeF);

  if(act.type==='exam'){
    const tlF = el('div',{class:'field'});
    tlF.appendChild(el('label',{},'Tiempo limite (minutos)'));
    const tlI = el('input',{type:'number',min:'1'}); tlI.value = act.timeLimitMinutes || 10;
    tlI.oninput = ()=>{ act.timeLimitMinutes = Number(tlI.value); };
    tlF.appendChild(tlI);
    card.appendChild(tlF);
  }

  card.appendChild(el('hr',{class:'divider'}));
  card.appendChild(el('h3',{},'Preguntas (opcion multiple)'));

  act.questions.forEach((q, qi)=>{
    const qCard = el('div',{class:'card',style:'background:var(--offwhite);'});
    const qHead = el('div',{class:'row-between'});
    qHead.appendChild(el('div',{style:'font-weight:600;'},'Pregunta '+(qi+1)));
    const delQBtn = el('button',{class:'danger small'},'Eliminar pregunta');
    delQBtn.onclick = ()=>{ act.questions.splice(qi,1); render(); };
    qHead.appendChild(delQBtn);
    qCard.appendChild(qHead);

    const qTextF = el('div',{class:'field'});
    qTextF.appendChild(el('label',{},'Texto de la pregunta'));
    const qTextI = el('textarea',{rows:'2'}); qTextI.value = q.text;
    qTextI.oninput = ()=>{ q.text = qTextI.value; };
    qTextF.appendChild(qTextI);
    qCard.appendChild(qTextF);

    const qImgF = el('div',{class:'field fileRow'});
    qImgF.appendChild(el('label',{},'Imagen (opcional)'));
    const qFileI = el('input',{type:'file',accept:'image/*'});
    qFileI.onchange = ()=>{
      handleImageFile(qFileI.files[0], (dataUrl)=>{ q.image = dataUrl; render(); });
    };
    qImgF.appendChild(qFileI);
    const qImgI = el('input',{type:'text',placeholder:'...o pega una URL de imagen'}); qImgI.value = q.image || '';
    qImgI.oninput = ()=>{ q.image = qImgI.value; };
    qImgF.appendChild(qImgI);
    if(q.image) qImgF.appendChild(el('img',{src:q.image,class:'att',style:'max-width:200px;'}));
    qCard.appendChild(qImgF);

    const ptsF = el('div',{class:'field'});
    ptsF.appendChild(el('label',{},'Puntos'));
    const ptsI = el('input',{type:'number',min:'0'}); ptsI.value = q.points;
    ptsI.oninput = ()=>{ q.points = Number(ptsI.value); };
    ptsF.appendChild(ptsI);
    qCard.appendChild(ptsF);

    qCard.appendChild(el('label',{},'Opciones (marca la correcta)'));
    q.options.forEach((opt, oi)=>{
      const optRow = el('div',{class:'qopt'});
      const radio = el('input',{type:'radio',name:'correct-'+q.id});
      radio.checked = q.correctIndex===oi;
      radio.onchange = ()=>{ q.correctIndex = oi; };
      const optI = el('input',{type:'text'}); optI.value = opt.text; optI.placeholder='Texto de la opcion';
      optI.oninput = ()=>{ opt.text = optI.value; };
      const delOptBtn = el('button',{class:'small ghost'},'x');
      delOptBtn.onclick = ()=>{ q.options.splice(oi,1); if(q.correctIndex>=q.options.length) q.correctIndex=0; render(); };
      optRow.appendChild(radio); optRow.appendChild(optI); optRow.appendChild(delOptBtn);
      qCard.appendChild(optRow);
    });
    const addOptBtn = el('button',{class:'small'},'+ Agregar opcion');
    addOptBtn.onclick = ()=>{ q.options.push({text:''}); render(); };
    qCard.appendChild(addOptBtn);

    card.appendChild(qCard);
  });

  const addQBtn = el('button',{style:'margin-top:8px;'},'+ Agregar pregunta');
  addQBtn.onclick = ()=>{
    act.questions.push({ id:uid(), text:'', image:'', points:1, options:[{text:''},{text:''}], correctIndex:0 });
    render();
  };
  card.appendChild(addQBtn);

  card.appendChild(el('hr',{class:'divider'}));
  card.appendChild(el('h3',{},'Asignar a alumnos'));
  const students = studentsList();
  if(students.length===0){
    card.appendChild(el('div',{class:'muted'},'No hay alumnos registrados todavia.'));
  }else{
    const chipbar = el('div',{class:'chipbar'});
    if(!act.assignedTo) act.assignedTo=[];
    students.forEach(s=>{
      const checked = act.assignedTo.includes(s.username);
      const chip = el('label',{style:'display:flex;align-items:center;gap:6px;border:1px solid var(--border-strong);padding:6px 10px;border-radius:8px;font-size:13px;cursor:pointer;'});
      const cb = el('input',{type:'checkbox'});
      cb.checked = checked;
      cb.onchange = ()=>{
        if(cb.checked){ if(!act.assignedTo.includes(s.username)) act.assignedTo.push(s.username); }
        else{ act.assignedTo = act.assignedTo.filter(u=>u!==s.username); }
      };
      chip.appendChild(cb);
      chip.appendChild(document.createTextNode(s.name));
      chipbar.appendChild(chip);
    });
    card.appendChild(chipbar);
  }

  card.appendChild(el('hr',{class:'divider'}));
  const saveRow = el('div',{class:'row'});
  const saveBtn = el('button',{class:'primary'},'Guardar actividad');
  saveBtn.onclick = ()=>{
    if(!act.name.trim()){ alert('Ponle un nombre a la actividad.'); return; }
    if(act.questions.length===0){ alert('Agrega al menos una pregunta.'); return; }
    for(const q of act.questions){
      if(!q.text.trim()){ alert('Todas las preguntas necesitan texto.'); return; }
      if(q.options.length<2){ alert('Cada pregunta necesita al menos 2 opciones.'); return; }
      if(q.options.some(o=>!o.text.trim())){ alert('Completa el texto de todas las opciones.'); return; }
    }
    const cat = findCategory(editingCategoryId);
    const existingIdx = cat.activities.findIndex(a=>a.id===act.id);
    const cleanAct = JSON.parse(JSON.stringify(act));
    delete cleanAct.__isNew;
    if(!cleanAct.submissions) cleanAct.submissions = {};
    if(existingIdx>=0) cat.activities[existingIdx] = cleanAct;
    else cat.activities.push(cleanAct);
    saveDB();
    editingActivity=null;
    render();
  };
  const cancelBtn = el('button',{},'Cancelar');
  cancelBtn.onclick = ()=>{ editingActivity=null; render(); };
  saveRow.appendChild(saveBtn); saveRow.appendChild(cancelBtn);
  card.appendChild(saveRow);

  root.appendChild(card);
}

function renderStudentActivities(){
  const myActs = [];
  DB.categories.forEach(cat=>{
    cat.activities.forEach(act=>{
      if(act.assignedTo && act.assignedTo.includes(session.username)) myActs.push({cat, act});
    });
  });

  if(myActs.length===0){
    root.appendChild(el('div',{class:'empty'},'No tienes actividades asignadas por ahora.'));
    return;

  const byCat = {};
  myActs.forEach(({cat,act})=>{

  });

  Object.values(byCat).forEach(({cat, acts})=>{
    const card = el('div',{class:'card'});
    card.appendChild(el('h3',{}, cat.name));
    acts.forEach(act=>{
      const item = el('div',{class:'list-item row-between'});
      const left = el('div');
      const typeLabel = act.type==='exam' ? 'Examen' : 'Trabajo';
      left.appendChild(el('div',{style:'font-weight:600;'}, act.name+' ',
        el('span',{class:'pill '+(act.type==='exam'?'pill-amber':'pill-blue')}, typeLabel)));
      const subs = (act.submissions && act.submissions[session.username]) || [];
      let statusText = activityTotalPoints(act)+' puntos';
      if(act.type==='work'){
        statusText += ' . intentos usados: '+subs.length+'/3';
        if(subs.length>0){
          const best = bestSubmission(act, session.username);
          statusText += ' . mejor puntaje: '+best.score+'/'+activityTotalPoints(act);
        }
      }else{
        statusText += subs.length>0 ? ' . ya respondido: '+subs[0].score+'/'+activityTotalPoints(act) : ' . sin responder';
        statusText += ' . tiempo: '+(act.timeLimitMinutes||0)+' min';
      }
      left.appendChild(el('div',{class:'muted'}, statusText));
      item.appendChild(left);

      const canStart = act.type==='work' ? subs.length<3 : subs.length===0;
      const btn = el('button',{class:'primary small'}, canStart? 'Iniciar' : 'Completado');
      btn.disabled = !canStart;
      btn.onclick = ()=> startActivity(cat, act);
      item.appendChild(btn);
      card.appendChild(item);
    });
    root.appendChild(card);
  });
}

function startActivity(cat, act){
  examAccepted = false;
  takingActivity = { activity:act, categoryId:cat.id, answers:{} };
  render();
}

function renderTakingActivity(){
  const {activity} = takingActivity;

  if(activity.type==='exam' && !examAccepted){
    root.appendChild(el('div',{class:'card'},[ el('h2',{}, activity.name) ]));
    const modal = el('div',{class:'center-modal'});
    const box = el('div',{class:'modal-box'});
    box.appendChild(el('h2',{}, 'Examen: '+activity.name));
    box.appendChild(el('p',{}, 'Tendras '+(activity.timeLimitMinutes||0)+' minutos para responder. Al hacer clic en Aceptar comenzara el temporizador.'));
    const row = el('div',{class:'row',style:'justify-content:center;'});
    const cancelBtn = el('button',{},'Cancelar');
    cancelBtn.onclick = ()=>{ takingActivity=null; render(); };
    const acceptBtn = el('button',{class:'primary'},'Aceptar');
    acceptBtn.onclick = ()=>{
      examAccepted = true;
      examTimeLeft = (activity.timeLimitMinutes||10)*60;
      startExamTimer();
      render();
    };
    row.appendChild(cancelBtn); row.appendChild(acceptBtn);
    box.appendChild(row);
    modal.appendChild(box);
    root.appendChild(modal);
    return;
  }

  if(activity.type==='exam'){
    const mins = String(Math.floor(examTimeLeft/60)).padStart(2,'0');
    const secs = String(examTimeLeft%60).padStart(2,'0');
    root.appendChild(el('div',{class:'timer'}, mins+':'+secs));
  }

  const card = el('div',{class:'card'});
  card.appendChild(el('h2',{}, activity.name));
  card.appendChild(el('p',{class:'muted'}, activityTotalPoints(activity)+' puntos totales'));

  activity.questions.forEach((q, qi)=>{
    const qCard = el('div',{class:'card',style:'background:var(--offwhite);'});
    qCard.appendChild(el('div',{style:'font-weight:600;margin-bottom:6px;'}, (qi+1)+'. '+q.text+' ', el('span',{class:'muted'},'('+q.points+' pts)')));
    if(q.image) qCard.appendChild(el('img',{src:q.image,class:'att'}));
    q.options.forEach((opt, oi)=>{
      const optRow = el('label',{style:'display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;'});
      const radio = el('input',{type:'radio',name:'q-'+q.id});
      radio.checked = takingActivity.answers[q.id]===oi;
      radio.onchange = ()=>{ takingActivity.answers[q.id]=oi; };
      optRow.appendChild(radio);
      optRow.appendChild(document.createTextNode(opt.text));
      qCard.appendChild(optRow);
    });
    card.appendChild(qCard);
  });

  const submitBtn = el('button',{class:'primary'},'Entregar actividad');
  submitBtn.onclick = ()=> submitActivity();
  card.appendChild(submitBtn);
  const cancelBtn = el('button',{style:'margin-left:8px;'},'Cancelar');
  cancelBtn.onclick = ()=>{
    if(examTimerInterval){ clearInterval(examTimerInterval); examTimerInterval=null; }
    takingActivity=null; render();
  };
  card.appendChild(cancelBtn);

  root.appendChild(card);
}

function startExamTimer(){
  if(examTimerInterval) clearInterval(examTimerInterval);
  examTimerInterval = setInterval(()=>{
    examTimeLeft--;
    if(examTimeLeft<=0){
      clearInterval(examTimerInterval); examTimerInterval=null;
      submitActivity();
      return;
    }
    const timerEl = document.querySelector('.timer');
    if(timerEl){
      const mins = String(Math.floor(examTimeLeft/60)).padStart(2,'0');
      const secs = String(examTimeLeft%60).padStart(2,'0');
      timerEl.textContent = mins+':'+secs;
    }
  },1000);
}

function submitActivity(){
  if(examTimerInterval){ clearInterval(examTimerInterval); examTimerInterval=null; }
  const {activity, categoryId, answers} = takingActivity;
  let score = 0;
  activity.questions.forEach(q=>{ if(answers[q.id]===q.correctIndex) score += Number(q.points)||0; });
  const total = activityTotalPoints(activity);

  const realAct = findActivity(categoryId, activity.id);
  if(!realAct.submissions) realAct.submissions = {};
  if(!realAct.submissions[session.username]) realAct.submissions[session.username] = [];
  realAct.submissions[session.username].push({ score, total, timestamp: Date.now() });
  saveDB();

  resultView = { name: activity.name, score, total };
  takingActivity = null;
  render();
}

function renderResult(){
  const card = el('div',{class:'card',style:'text-align:center;max-width:340px;margin:60px auto;'});
  card.appendChild(el('h2',{}, resultView.name));
  card.appendChild(el('p',{class:'muted'},'Puntaje obtenido'));
  card.appendChild(el('div',{class:'badge-score'}, resultView.score+' / '+resultView.total));
  const btn = el('button',{class:'primary',style:'margin-top:16px;'},'Volver a mis actividades');
  btn.onclick = ()=>{ resultView=null; studentTab='activities'; render(); };
  card.appendChild(btn);
  root.appendChild(card);
}

/* ---------- Inicio ---------- */
(async function init(){
  await loadDB();
  restoreSession();
  render();
})();
</script>
</body>
</html>
