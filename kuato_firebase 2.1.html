<style>
  :root{
    --navy:#293379; --navy-dark:#1a2050; --yellow:#e5a300; --red:#b81817; --lettuce:#a6af32; --beans:#607829; --orange:#ee7302;
    --bg:#faf7ee; --card:#ffffff; --border:#e6e0cf; --border-strong:#d2c9ac;
    --text:#293379; --text2:#4a4f6b; --muted:#8b8672;
    --accent:#293379; --accent-2:#e5a300;
    --danger:#b81817; --danger-bg:#fbe8e7;
    --success:#607829; --success-bg:#eef2e2;
    --warn:#ee7302; --warn-bg:#fdece0;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Merriweather',Georgia,serif;background:var(--bg);color:var(--text);}
  .app{width:100%;margin:0;padding:0 0 80px;}
  .content{max-width:1200px;margin:0 auto;}
  .content{padding:20px 16px 0;}
  .brand{font-family:'Playfair Display',Georgia,serif;font-weight:700;letter-spacing:.5px;color:var(--yellow);}
  h1{font-size:22px;margin:0 0 4px;font-weight:700;}
  h2{font-size:18px;font-weight:700;margin:0 0 12px;}
  h3{font-size:15px;font-weight:700;margin:0 0 8px;}
  p{line-height:1.65;}
  .muted{color:var(--muted);font-size:13px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  input[type=text],input[type=password],input[type=number],input[type=datetime-local],textarea,select{
    width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:8px;
    font-size:14px;font-family:'Merriweather',Georgia,serif;background:#fff;color:var(--text);
  }
  textarea{resize:vertical;min-height:70px;}
  label{font-size:13px;font-weight:700;color:var(--text2);display:block;margin-bottom:4px;}
  .field{margin-bottom:12px;}
  button{
    cursor:pointer;border:1px solid var(--border-strong);background:#fff;color:var(--text);
    padding:9px 16px;border-radius:8px;font-size:14px;font-weight:700;font-family:'Merriweather',Georgia,serif;
  }
  button:hover{background:var(--bg);}
  button.primary{background:var(--navy);border-color:var(--navy);color:#fff;}
  button.primary:hover{background:#1c234f;}
  button.accent{background:var(--yellow);border-color:var(--yellow);color:var(--navy);}
  button.accent:hover{background:#cc9000;}
  button.danger{background:var(--danger-bg);border-color:#f0c4be;color:var(--danger);}
  button.danger:hover{background:#f6d6d1;}
  button.ghost{border-color:transparent;background:transparent;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  button.small{padding:5px 10px;font-size:12px;}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;}
  .pill-blue{background:#e6e9f7;color:var(--navy);}
  .pill-green{background:var(--success-bg);color:var(--success);}
  .pill-amber{background:var(--warn-bg);color:var(--warn);}
  .pill-gray{background:#f0ede0;color:var(--text2);}
  .pill-red{background:var(--danger-bg);color:var(--danger);}
  .list-item{padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:#fff;}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;overflow:hidden;flex-shrink:0;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .avatar-lg{width:96px;height:96px;font-size:32px;}
  .err{color:var(--danger);font-size:13px;margin-top:4px;}
  .divider{border:none;border-top:1px solid var(--border);margin:16px 0;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .qopt{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .qopt input[type=text]{flex:1;}
  .timer{position:fixed;top:14px;right:14px;background:var(--navy);color:#fff;padding:8px 14px;border-radius:8px;font-weight:700;font-size:15px;z-index:120;}
  .center-modal{position:fixed;inset:0;background:rgba(41,51,121,.5);display:flex;align-items:center;justify-content:center;z-index:200;}
  .modal-box{background:#fff;border-radius:12px;padding:24px;max-width:380px;width:90%;text-align:center;}
  .empty{padding:30px;text-align:center;color:var(--muted);font-size:14px;}
  .login-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-direction:column;}
  .login-page{min-height:100vh;width:100%;background:var(--navy);display:flex;flex-wrap:wrap;position:relative;}

  .exercise-intro-page{min-height:100vh;width:100%;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .exercise-mascot{width:160px;height:160px;object-fit:contain;animation:mascot-float 3.2s ease-in-out infinite;}
  @keyframes mascot-float{
    0%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-14px) rotate(-2deg); }
    100%{ transform:translateY(0) rotate(0deg); }
  }
  .login-left{width:40%;min-height:100vh;position:relative;overflow:hidden;background:var(--navy);border-radius:0 28px 28px 0;}
  .login-left-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.5) saturate(1.2) contrast(1.05) brightness(.65);opacity:0;transition:opacity 1.2s ease;}
  .login-left-slide.active{opacity:1;}
  .login-left-tint{position:absolute;inset:0;background:var(--navy);mix-blend-mode:multiply;opacity:.45;}
  .login-left-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;pointer-events:none;}
  .login-left-text div{color:rgba(255,255,255,0.85);font-weight:700;line-height:1.3;}
  .login-carousel-nav{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:3;}
  .login-carousel-btn{background:rgba(255,255,255,.18);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;}
  .login-carousel-btn:hover{background:rgba(255,255,255,.32);}
  .login-right{flex:1;min-width:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:16px;}
  .login-below-card{max-width:360px;width:100%;text-align:center;color:rgba(255,255,255,.9);}
  .login-footer{width:100%;text-align:center;color:rgba(255,255,255,.85);padding:18px 16px 22px;font-size:13px;background:var(--navy-dark);}
  .login-footer a{color:var(--yellow);text-decoration:underline;}
  .login-card-v2{background:#fff;border-radius:18px;padding:34px 30px;max-width:360px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.3);}
  .login-card-v2 input{border-color:var(--border-strong);}
  .login-card-v2 input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(41,51,121,.12);}
  .login-card-v2 button.primary{border-radius:10px;}
  @media (max-width:700px){
    .login-left{display:none;}
    .login-right{width:100%;}
  }
  .login-card{width:100%;max-width:340px;}
  .badge-score{font-size:26px;font-weight:700;color:var(--navy);}
  .clickable{cursor:pointer;}
  .chipbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .metric{background:var(--bg);border-radius:var(--radius);padding:16px;text-align:center;}
  .metric .num{font-size:26px;font-weight:700;color:var(--navy);}
  .metric .lbl{font-size:12px;color:var(--muted);margin-top:2px;}
  .fileRow{display:flex;flex-direction:column;gap:6px;}
  .studentRow{padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:#fff;}
  .actionbar{display:flex;gap:6px;flex-wrap:wrap;}

  /* Header */
  .topbar{background:var(--navy);height:60px;box-sizing:border-box;padding:0 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:60;}
  .topbar-left{display:flex;align-items:center;gap:10px;}
  .hamburger{width:26px;height:26px;display:flex;flex-direction:column;justify-content:center;gap:5px;cursor:pointer;background:none;border:none;padding:0;}
  .hamburger span{display:block;height:2.5px;width:100%;background:#fff;border-radius:2px;}
  .logo-unit{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .logo-unit img{width:42px;height:42px;object-fit:contain;}
  .logo-unit .brand{font-size:22px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .topbar .avatar{width:32px;height:32px;border:2px solid var(--yellow);}

  /* Side drawer */
  .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90;}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:230px;background:var(--bg);z-index:100;padding:14px 0;box-shadow:2px 0 10px rgba(0,0,0,.15);overflow-y:auto;}
  .drawer-head{display:flex;align-items:center;gap:8px;padding:6px 16px 14px;border-bottom:1px solid var(--border);margin-bottom:8px;}
  .drawer-item{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;color:var(--text);font-size:14px;}
  .drawer-item:hover{background:#f0ecdc;}
  .drawer-item.active{background:var(--yellow);color:var(--navy);font-weight:700;}
  .drawer-item svg{flex-shrink:0;}
  .drawer-item.logout{color:var(--danger);margin-top:8px;border-top:1px solid var(--border);padding-top:14px;}
  .nav-dot{position:absolute;top:-3px;right:-4px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:1.5px solid var(--bg);}
  .icon-rail{display:none;}
  @media (min-width:800px){
    .icon-rail{display:flex;flex-direction:column;align-items:center;gap:6px;position:fixed;top:60px;left:0;bottom:0;width:56px;background:var(--card);border-right:1px solid var(--border);padding:14px 0;z-index:40;}
    .rail-item{position:relative;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);}
    .rail-item:hover{background:var(--bg);}
    .rail-item.active{background:var(--yellow);color:var(--navy);}
    .rail-dot{top:2px;right:2px;}
  }
  .section-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .back-arrow{cursor:pointer;display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;flex-shrink:0;}
  .back-arrow:hover{background:var(--border);}

  .board-img-wrap{position:relative;overflow:hidden;border-radius:10px;margin-bottom:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);}
  .board-img-wrap img{display:block;width:100%;object-fit:contain;}
  .board-img-wrap.size-sm img{max-height:160px;}
  .board-img-wrap.size-md img{max-height:280px;}
  .board-img-wrap.size-lg img{max-height:420px;}
  .board-fade-top,.board-fade-bottom{position:absolute;left:0;right:0;height:14px;pointer-events:none;}
  .board-fade-top{top:0;background:linear-gradient(to bottom, var(--bg), rgba(250,247,238,0));}
  .board-fade-bottom{bottom:0;background:linear-gradient(to top, var(--bg), rgba(250,247,238,0));}

  .pizarra-canvas{position:relative;width:100%;aspect-ratio:4/3;border-radius:10px;border:1px solid var(--border);overflow:hidden;touch-action:none;}
  .pizarra-canvas-full{aspect-ratio:auto;min-height:420px;border-radius:0;margin:0 -16px;width:calc(100% + 32px);overflow:visible;}
  .pizarra-item{position:absolute;box-sizing:border-box;overflow:hidden;cursor:move;border-radius:6px;}
  .pizarra-item.readonly{cursor:default;}
  .pizarra-item.has-link{cursor:pointer;}
  .pizarra-item.selected{outline:2px dashed var(--navy);}
  .pizarra-item.type-zone{cursor:move;}
  .resize-handle{position:absolute;bottom:0;right:0;width:16px;height:16px;background:var(--navy);border-radius:3px 0 6px 0;cursor:nwse-resize;opacity:.85;}
  @media (max-width:600px){
    .pizarra-canvas{aspect-ratio:3/4;}
    .pizarra-canvas-full{min-height:360px;margin:0 -10px;width:calc(100% + 20px);}
  }

  @media (max-width:600px){
    .app{padding:0 0 70px;}
    .content{padding:14px 10px 0;}
    .card{padding:14px;}
    .grid2{grid-template-columns:1fr;}
    .row-between{flex-direction:column;align-items:stretch;}
    .row-between > div{width:100%;}
    .list-item,.studentRow{padding:12px;}
    .list-item .row, .studentRow .row, .actionbar{width:100%;}
    .list-item button, .studentRow button, .actionbar button{flex:1;min-width:0;}
    button{padding:10px 14px;font-size:14px;}
    .timer{top:8px;right:8px;font-size:13px;padding:6px 10px;}
    .modal-box{padding:18px;}
    .drawer{width:200px;}
  }
</style>
</head>

async function loadDB(){
  try{
    const snap = await FIRESTORE_DOC.get();
    if(snap.exists && snap.data() && snap.data().json){
      DB = JSON.parse(snap.data().json);
    }else{
      DB = defaultDB();
      await saveDB();
    }
  }catch(e){
    console.error('Error cargando datos de Firebase', e);
    DB = defaultDB();
  }
  if(!DB.users) DB.users = defaultDB().users;
  if(!DB.board) DB.board = defaultDB().board;
  if(!DB.loginDesign) DB.loginDesign = defaultDB().loginDesign;
  if(!DB.loginDesign.bgImages){
    DB.loginDesign.bgImages = DB.loginDesign.bgImage ? [DB.loginDesign.bgImage] : [];
    delete DB.loginDesign.bgImage;
  }
  if(DB.loginDesign.phrases && !DB.loginDesign.bgText){
    DB.loginDesign.bgText = DB.loginDesign.phrases.join('\n');
    delete DB.loginDesign.phrases;
  }
  if(DB.loginDesign.bgText===undefined) DB.loginDesign.bgText = 'KUATO';
  if(!DB.loginDesign.bgTextFontFamily) DB.loginDesign.bgTextFontFamily = 'Playfair Display';
  DB.loginDesign.bgTextFontSize = DB.loginDesign.bgTextFontSize || DB.loginDesign.patternFontSize || 22;
  delete DB.loginDesign.patternFontSize;
  if(!DB.loginDesign.footerFontSize) DB.loginDesign.footerFontSize = 13;
  if(!DB.loginDesign.belowCardLinks) DB.loginDesign.belowCardLinks = [];
  DB.loginDesign.belowCardLinks.forEach(l=>{ if(!l.id) l.id = uid(); });
  if(DB.loginDesign.belowCardText===undefined) DB.loginDesign.belowCardText = '';
  if(!DB.loginDesign.belowCardLinkColor) DB.loginDesign.belowCardLinkColor = 'yellow';
  if(!DB.loginDesign.belowCardFontSize) DB.loginDesign.belowCardFontSize = 13;
  if(!DB.loginDesign.footerLinks) DB.loginDesign.footerLinks = [];
  DB.loginDesign.footerLinks.forEach(l=>{ if(!l.id) l.id = uid(); if(l.name===undefined) l.name = l.label || ''; });
  if(DB.loginDesign.footerText===undefined) DB.loginDesign.footerText = '';
  if(DB.contactInfo===undefined) DB.contactInfo = '';
  if(!DB.board.elements){
    const elements = [];
    let yCursor = 4;
    (DB.board.texts||[]).forEach(t=>{
      elements.push({id:uid(), type:'text', x:5, y:yCursor, w:60, h:16, content:t.content, color:t.color||'navy'});
      yCursor += 18;
    });
    const hMap = {sm:14, md:22, lg:32};
    (DB.board.images||[]).forEach(img=>{
      elements.push({id:uid(), type:'image', x:8, y:yCursor, w:60, h:hMap[img.size]||22, src:img.src});
      yCursor += (hMap[img.size]||22) + 3;
    });
    DB.board.elements = elements;
    DB.board.bgColor = DB.board.bgColor || 'bg';
    delete DB.board.texts;
    delete DB.board.images;
  }
  DB.board.elements.forEach(item=>{
    if(item.type==='text'){
      if(item.opacity===undefined) item.opacity = 100;
      if(!item.fontFamily) item.fontFamily = 'Merriweather';
      if(!item.fontSize) item.fontSize = 14;
    }else if(item.type==='zone'){
      if(item.opacity===undefined) item.opacity = 100;
    }else if(item.type==='image'){
      if(!item.linkType) item.linkType = 'none';
      if(item.linkUrl===undefined) item.linkUrl = '';
      if(item.rotation===undefined) item.rotation = 0;
    }
  });
  if(!DB.board.footerLinks) DB.board.footerLinks = [];
  DB.board.footerLinks.forEach(l=>{ if(!l.id) l.id = uid(); });
  if(DB.board.footerText===undefined) DB.board.footerText = '';
  if(!DB.board.coordVersion){
    DB.board.elements.forEach(it=>{ it.y = (it.y||0)*6; it.h = (it.h||10)*6; });
    DB.board.coordVersion = 2;
  }
  if(!DB.categories) DB.categories = [];
  if(!DB.exercises) DB.exercises = [];
  DB.exercises.forEach(ex=>{ if(!ex.results) ex.results = {}; });
  if(!DB.exerciseSections){
    DB.exerciseSections = [];
    if(DB.exercises.length>0){
      const allStudents = Object.entries(DB.users).filter(([u,d])=>d.role==='student').map(([u])=>u);
      DB.exerciseSections.push({
        id: uid(), name: 'General', assignedTo: allStudents,
        categories: [{ id: uid(), name: 'General', exercises: DB.exercises }]
      });
    }
    DB.exercises = [];
  }
  DB.exerciseSections.forEach(sec=>{
    if(!sec.assignedTo) sec.assignedTo = [];
    if(!sec.categories) sec.categories = [];
    sec.categories.forEach(cat=>{
      if(!cat.exercises) cat.exercises = [];
      cat.exercises.forEach(ex=>{ if(!ex.results) ex.results = {}; });
    });
  });
  Object.values(DB.users).forEach(u=>{
    if(u.photo===undefined) u.photo='';
    if(u.role==='student' && u.extraPoints===undefined) u.extraPoints=0;
  });
}

const MAX_IMAGE_BYTES = 750*1024;
function handleImageFile(file, onDone){
  if(!file) return;
  if(!file.type.startsWith('image/')){ alert('Selecciona un archivo de imagen valido.'); return; }
  if(file.size > MAX_IMAGE_BYTES){ alert('La imagen es muy pesada. Usa una menor a 750 KB para que se pueda guardar.'); return; }
  const reader = new FileReader();
  reader.onload = ()=> onDone(reader.result);
  reader.onerror = ()=> alert('No se pudo leer la imagen.');
  reader.readAsDataURL(file);
}

/* ---------- Imagenes guardadas aparte (para no llenar el documento principal) ---------- */
const MEDIA_COLLECTION = firestoreDB.collection('kuato_media');
const INSCRIPCIONES_COLLECTION = firestoreDB.collection('kuato_inscripciones');
const mediaCache = {};

async function uploadDataUrlToMedia(dataUrl, onReady){
  try{
    const id = uid();
    await MEDIA_COLLECTION.doc(id).set({ data: dataUrl });
    mediaCache[id] = dataUrl;
    onReady('media:'+id);
  }catch(e){
    console.error('Error subiendo imagen', e);
    alert('No se pudo subir la imagen. Revisa tu conexion e intenta de nuevo.');
  }
}

function handleImageFileToMedia(file, onReady){
  handleImageFile(file, (dataUrl)=> uploadDataUrlToMedia(dataUrl, onReady));
}

function compressImageFile(file, maxDim, quality, onDone){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      const scale = Math.min(1, maxDim/Math.max(w,h));
      w = Math.max(1, Math.round(w*scale));
      h = Math.max(1, Math.round(h*scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      onDone(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=> alert('No se pudo procesar la imagen.');
    img.src = e.target.result;
  };
  reader.onerror = ()=> alert('No se pudo leer la imagen.');
  reader.readAsDataURL(file);
}

const MAX_ORIGINAL_FOR_COMPRESSION = 15*1024*1024;
function handleImageFileCompressedToMedia(file, onReady){
  if(!file) return;
  if(!file.type.startsWith('image/')){ alert('Selecciona un archivo de imagen valido.'); return; }
  if(file.size > MAX_ORIGINAL_FOR_COMPRESSION){ alert('La imagen es demasiado pesada incluso para comprimir. Usa una menor a 15 MB.'); return; }
  compressImageFile(file, 1600, 0.82, (dataUrl)=>{
    uploadDataUrlToMedia(dataUrl, onReady);
  });
}
function resolveMediaSrc(imgEl, ref){
  if(!ref){ imgEl.src=''; return; }
  if(!ref.startsWith('media:')){ imgEl.src = ref; return; }
  const id = ref.slice(6);
  if(mediaCache[id]){ imgEl.src = mediaCache[id]; return; }
  imgEl.src = '';
  MEDIA_COLLECTION.doc(id).get().then(snap=>{
    const val = snap.exists ? snap.data().data : '';
    mediaCache[id] = val;
    imgEl.src = val;
  }).catch(()=>{});
}
function mediaImg(ref, attrs){
  const attrsCopy = Object.assign({}, attrs);
  delete attrsCopy.src;
  const img = el('img', attrsCopy);
  resolveMediaSrc(img, ref);
  return img;
}


function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(()=> fallbackCopy(text));
  }else{
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

function activityTotalPoints(act){

function bestSubmission(act, username){
  const subs = (act.submissions && act.submissions[username]) || [];
  if(subs.length===0) return null;
  return subs.reduce((best,s)=> s.pct>best.pct? s: best, subs[0]);
}
function effectivePct(act, username){
  const best = bestSubmission(act, username);
  if(best) return best.pct;
  if(act.availableUntil && new Date() > new Date(act.availableUntil)) return 0;
  return null;
}
function alreadyOpenedExam(act, username){
  return !!(act.inProgress && act.inProgress[username]);
}
function isLocked(act){
  if(!act.availableUntil) return false;
  return new Date() > new Date(act.availableUntil);
}
function hoursUntilDeadline(act){
  if(!act.availableUntil) return null;
  return (new Date(act.availableUntil) - new Date()) / (1000*60*60);
}
function isDueSoon(act){
  const h = hoursUntilDeadline(act);
  return h!==null && h>0 && h<=24;
}
function fmtDeadline(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('es-MX',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
}
/* ---------- Motor de expresiones seguro (para preguntas dinamicas) ---------- */
function evalExpr(expr, vars){
  let pos = 0;
  function peek(){ return expr[pos]; }
  function eatSpace(){ while(pos<expr.length && expr[pos]===' ') pos++; }
  function parseNumber(){
    eatSpace();
    const start=pos;
    while(pos<expr.length && /[0-9.]/.test(expr[pos])) pos++;
    return parseFloat(expr.slice(start,pos));
  }
  function parseIdent(){
    eatSpace();
    const start=pos;
    while(pos<expr.length && /[a-zA-Z_]/.test(expr[pos])) pos++;
    const name = expr.slice(start,pos);
    if(!(name in vars)) throw new Error('variable no definida: '+name);
    return vars[name];
  }
  function parseFactor(){
    eatSpace();
    if(peek()==='('){ pos++; const v=parseExpr(); eatSpace(); if(peek()===')') pos++; return v; }
    if(peek()==='-'){ pos++; return -parseFactor(); }
    if(peek()==='+'){ pos++; return parseFactor(); }
    if(/[0-9.]/.test(peek())) return parseNumber();
    if(/[a-zA-Z_]/.test(peek())) return parseIdent();
    throw new Error('caracter inesperado en expresion');
  }
  function parsePow(){
    const base = parseFactor();
    eatSpace();
    if(peek()==='^'){ pos++; return Math.pow(base, parsePow()); }
    return base;
  }
  function parseTerm(){
    let v = parsePow();
    eatSpace();
    while(peek()==='*'||peek()==='/'){
      const op=peek(); pos++;
      const rhs=parsePow();
      v = op==='*' ? v*rhs : v/rhs;
      eatSpace();
    }
    return v;
  }
  function parseExpr(){
    let v = parseTerm();
    eatSpace();
    while(peek()==='+'||peek()==='-'){
      const op=peek(); pos++;
      const rhs=parseTerm();
      v = op==='+' ? v+rhs : v-rhs;
      eatSpace();
    }
    return v;
  }
  return parseExpr();
}
function formatExprResult(n){
  if(!isFinite(n)) return String(n);
  return (Math.abs(n - Math.round(n)) < 1e-9) ? String(Math.round(n)) : String(Math.round(n*100)/100);
}
function rollDynamicVars(vars){
  const values = {};
  (vars||[]).forEach(v=>{
    const min = v.min, max = v.max;
    values[v.name] = Math.floor(Math.random()*(max-min+1))+min;
  });
  return values;
}
function substitutePlaceholders(str, values){
  if(!str) return str;
  return str.replace(/\{([^}]+)\}/g, (m, expr)=>{
    try{ return formatExprResult(evalExpr(expr.trim(), values)); }
    catch(e){ return m; }
  });
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function studentAverage(username){
  let workPcts=[], examPcts=[];
  DB.categories.forEach(cat=>{
    cat.activities.forEach(act=>{
      if(!act.assignedTo || !act.assignedTo.includes(username)) return;
      const pct = effectivePct(act, username);
      if(pct===null) return;
      if(act.type==='work') workPcts.push(pct);
      else examPcts.push(pct);
    });
  });
  const rec = DB.users[username] || {};
  const extra = Number(rec.extraPoints)||0;
  const avgWork = workPcts.length? workPcts.reduce((a,b)=>a+b,0)/workPcts.length : null;
  const avgExam = examPcts.length? examPcts.reduce((a,b)=>a+b,0)/examPcts.length : null;
  let base;
  if(avgWork!==null && avgExam!==null) base = avgWork*0.4 + avgExam*0.6;
  else if(avgWork!==null) base = avgWork;
  else if(avgExam!==null) base = avgExam;
  else base = null;
  if(base===null && extra===0) return null;
  const final = Math.round((base||0) + extra);
  return { avgWork: avgWork===null?null:Math.round(avgWork), avgExam: avgExam===null?null:Math.round(avgExam), extra, final };
}

/* ---------- Sesion persistente ---------- */
function saveSession(){
  try{
    sessionStorage.setItem('kuato_session', JSON.stringify({
      username: session.username, teacherTab, studentTab
    }));
  }catch(e){}
}
function restoreSession(){
  try{
    const raw = sessionStorage.getItem('kuato_session');
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(saved && saved.username && DB.users[saved.username]){
      const rec = DB.users[saved.username];
      session = { username: saved.username, role: rec.role, name: rec.name || saved.username };
      if(saved.teacherTab) teacherTab = saved.teacherTab;
      if(saved.studentTab) studentTab = saved.studentTab;
    }else{
      sessionStorage.removeItem('kuato_session');
    }
  }catch(e){}
}
function logout(){
  session=null; loginError=''; takingActivity=null; resultView=null; drawerOpen=false;
  try{ sessionStorage.removeItem('kuato_session'); }catch(e){}
  render();
}

/* ---------- Cierre de sesion por inactividad (15 min) ---------- */
const IDLE_LIMIT_MS = 15*60*1000;
let idleTimer = null;
function resetIdleTimer(){
  if(idleTimer) clearTimeout(idleTimer);
  if(!session) return;
  idleTimer = setTimeout(()=>{
    if(session && !takingActivity){
      logout();
    }else if(session && takingActivity){
      resetIdleTimer();
    }
  }, IDLE_LIMIT_MS);
}
['mousemove','keydown','click','touchstart','scroll'].forEach(evt=>{
  document.addEventListener(evt, resetIdleTimer, {passive:true});
});

let loginCarouselInterval = null;

function renderFooterRichText(text, links, opts){
  opts = opts || {};
  const container = document.createElement('div');
  if(opts.fontSize) container.style.fontSize = opts.fontSize+'px';
  const linkMap = {};
  links.forEach(l=>{ linkMap[l.id]=l; });
  const paragraphs = (text||'').split(/\n{2,}/);
  paragraphs.forEach(paraText=>{
    if(!paraText.trim()) return;
    const p = document.createElement('p');
    p.style.margin = '0 0 8px';
    const lines = paraText.split('\n');
    lines.forEach((line, li)=>{
      const parts = line.split(/(\{\{link:[a-z0-9]+\}\})/g);
      parts.forEach(part=>{
        const m = part.match(/^\{\{link:([a-z0-9]+)\}\}$/);
        if(m && linkMap[m[1]]){
          const link = linkMap[m[1]];
          const a = document.createElement('a');
          a.href = link.url || '#';
          a.target = '_blank'; a.rel='noopener';
          a.textContent = link.name || 'enlace';
          if(opts.linkColor){
            a.style.color = opts.linkColor; a.style.textDecoration='underline';
          }else if(opts.linkStyle==='bold'){
            a.style.fontWeight='700'; a.style.textDecoration='underline'; a.style.color='inherit';
          }else{
            a.style.color='var(--yellow)'; a.style.textDecoration='underline';
          }
          p.appendChild(a);
        }else if(part){
          p.appendChild(document.createTextNode(part));
        }
      });
      if(li < lines.length-1) p.appendChild(document.createElement('br'));
    });
    container.appendChild(p);
  });
  return container;
}

function renderLogin(){
  if(loginCarouselInterval){ clearInterval(loginCarouselInterval); loginCarouselInterval=null; }

  const page = el('div',{class:'login-page'});

  const left = el('div',{class:'login-left'});
  const images = DB.loginDesign.bgImages || [];
  const slideEls = [];
  images.forEach((src, i)=>{
    const img = mediaImg(src, {class:'login-left-slide'+(i===0?' active':'')});
    slideEls.push(img);
    left.appendChild(img);
  });
  left.appendChild(el('div',{class:'login-left-tint'}));
  if(DB.loginDesign.bgText && DB.loginDesign.bgText.trim()){
    const textWrap = el('div',{class:'login-left-text'});

    });
    left.appendChild(textWrap);
  }

  if(images.length>1){
    let idx = 0;
    function showSlide(i){
      idx = (i+images.length)%images.length;
      slideEls.forEach((im,k)=> im.classList.toggle('active', k===idx));
    }
    const nav = el('div',{class:'login-carousel-nav'});
    const prevBtn = el('button',{class:'login-carousel-btn'},'‹');
    prevBtn.onclick = ()=> showSlide(idx-1);

    nextBtn.onclick = ()=> showSlide(idx+1);
    nav.appendChild(prevBtn); nav.appendChild(nextBtn);

  page.appendChild(left);

  const right = el('div',{class:'login-right'});

  btn.onclick = ()=>{

    loginError='';
    session = { username:u, role:rec.role, name:rec.name || u };

/* ---------- Helpers DOM ---------- */
function el(tag, attrs={}, ...children){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c=>{
    if(c===null||c===undefined) return;
    if(typeof c==='string') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}

function avatarNode(user, size){
  const cls = 'avatar'+(size==='lg'?' avatar-lg':'');
  const a = el('div',{class:cls});
  if(user.photo){
    a.appendChild(mediaImg(user.photo, {}));
  }else{
    a.textContent = (user.name||user.username||'?').slice(0,1).toUpperCase();
  }
  return a;
}

function renderStudentActivityHistory(container){
  const {catId, actId} = viewingHistoryFor;
  const act = findActivity(catId, actId);
  if(!act){ viewingHistoryFor=null; render(); return; }
  container.appendChild(sectionHead(act.name));

  const card = el('div',{class:'card'});
  const backBtn = el('button',{class:'small'},'Volver a mis actividades');
  backBtn.onclick = ()=>{ viewingHistoryFor=null; render(); };
  card.appendChild(backBtn);

  const subs = (act.submissions && act.submissions[session.username]) || [];
  if(subs.length===0){
    card.appendChild(el('p',{class:'muted',style:'margin-top:10px;'},'Aun no has entregado esta actividad.'));
    container.appendChild(card);
    return;
  }
  const best = act.type==='work' ? bestSubmission(act, session.username) : subs[0];

  card.appendChild(el('div',{class:'badge-score',style:'margin-top:10px;'}, best.pct+'%'));
  card.appendChild(el('p',{class:'muted'}, subs.length+' intento(s) . '+(act.type==='exam'?'Examen':'Trabajo')));
  container.appendChild(card);

  const qCard = el('div',{class:'card'});
  qCard.appendChild(el('h3',{},'Revision de respuestas'));
  act.questions.forEach((q,qi)=>{
    const given = best.answers ? best.answers[q.id] : undefined;
    let correct, givenText, correctText;
    if(q.type==='short'){
      const norm = (s)=> (s||'').toString().trim().toLowerCase();
      correct = given!==undefined && (q.acceptedAnswers||[]).some(a=>norm(a)===norm(given));
      givenText = (given!==undefined && given!=='') ? given : '(sin responder)';
      correctText = (q.acceptedAnswers||[]).join(' / ');
    }else{
      correct = given===q.correctIndex;
      givenText = (given!==undefined && q.options[given]) ? q.options[given].text : '(sin responder)';
      correctText = q.options[q.correctIndex] ? q.options[q.correctIndex].text : '';
    }
    const box = el('div',{style:'padding:10px 0;border-top:1px solid var(--border);'});
    box.appendChild(el('div',{style:'font-weight:700;font-size:14px;'}, (qi+1)+'. '+q.text));
    if(q.note) box.appendChild(el('div',{class:'muted',style:'font-size:12px;margin-top:2px;'}, q.note));
    box.appendChild(el('div',{style:'font-size:13px;margin-top:4px;color:'+(correct?'var(--success)':'var(--danger)')+';'}, (correct?'✓ ':'✗ ')+'Respondiste: '+givenText));
    if(!correct) box.appendChild(el('div',{style:'font-size:13px;color:var(--success);'}, 'Correcta: '+correctText));
    qCard.appendChild(box);
  });
  container.appendChild(qCard);
}

function getDeviceView(item, device){
  if(device!=='phone') return item;
  return new Proxy(item, {
    get(target, prop){
      if(prop==='x') return target.phoneX!==undefined?target.phoneX:target.x;
      if(prop==='y') return target.phoneY!==undefined?target.phoneY:target.y;
      if(prop==='w') return target.phoneW!==undefined?target.phoneW:target.w;
      if(prop==='h') return target.phoneH!==undefined?target.phoneH:target.h;
      return target[prop];
    },
    set(target, prop, value){
      if(prop==='x'){ target.phoneX=value; return true; }
      if(prop==='y'){ target.phoneY=value; return true; }
      if(prop==='w'){ target.phoneW=value; return true; }
      if(prop==='h'){ target.phoneH=value; return true; }
      target[prop]=value; return true;
    }
  });
}

function boardCanvasHeight(device){
  let maxBottom = 0;
  DB.board.elements.forEach(it=>{ const v=getDeviceView(it,device); maxBottom = Math.max(maxBottom, (v.y||0)+(v.h||0)); });
  return Math.max(420, maxBottom + 80);
}
function nextBoardY(device){
  let maxBottom = 0;
  DB.board.elements.forEach(it=>{ const v=getDeviceView(it,device); maxBottom = Math.max(maxBottom, (v.y||0)+(v.h||0)); });
  return maxBottom + 20;
}

const PIZARRA_REFERENCE_WIDTH = 900;

function buildPizarraBox(item, canvasEl, editable, scale){
  scale = scale || 1;
  const box = el('div',{
    class:'pizarra-item type-'+item.type+(selectedElementId===item.id?' selected':'')+(editable?'':' readonly'),
    style:'left:'+item.x+'%;top:'+(item.y*scale)+'px;width:'+item.w+'%;height:'+(item.h*scale)+'px;',
    'data-el-id': item.id
  });

  if(item.type==='zone'){
    box.style.background = colorHex(item.color);
    box.style.opacity = (item.opacity!==undefined?item.opacity:100)/100;
  }else if(item.type==='image'){
    const rot = item.rotation||0;
    box.appendChild(mediaImg(item.src, {style:'width:100%;height:100%;object-fit:cover;object-position:'+(item.cropX!==undefined?item.cropX:50)+'% '+(item.cropY!==undefined?item.cropY:50)+'%;pointer-events:none;transform:rotate('+rot+'deg);'}));
  }else if(item.type==='text'){
    box.style.background = hexToRgba(colorHex(item.color), (item.opacity!==undefined?item.opacity:100)/100);
    const txtColor = item.textColor ? (item.textColor==='white'?'#ffffff':colorHex(item.textColor)) : textColorForBg(item.color, item.opacity);
    box.appendChild(el('div',{style:'padding:8px 10px;font-size:'+((item.fontSize||14)*scale)+'px;font-family:\''+(item.fontFamily||'Merriweather')+'\',serif;white-space:pre-wrap;overflow:hidden;pointer-events:none;color:'+txtColor+';'}, item.content));
  }

  if(!editable && item.linkType && item.linkType!=='none'){
    box.classList.add('has-link');
    box.onclick = ()=>{
      if(item.linkType==='internal') goToTab(item.linkUrl||'info');
      else if(item.linkUrl) window.open(item.linkUrl,'_blank');
    };
  }

  if(editable){
    let moved = false;
    attachDragHandlers(box, item, ()=>canvasEl, scale, (didMove)=>{
      moved = didMove;
      saveDB();
      if(!didMove){ selectedElementId = item.id; }
      render();
    });
    const handle = el('div',{class:'resize-handle'});

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16);
  const g = parseInt(h.substring(2,4),16);
  const b = parseInt(h.substring(4,6),16);
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}
function textColorForBg(colorKey, opacity){
  if((opacity!==undefined?opacity:100) < 40) return '#1c1e21';
  const darkBgKeys = ['navy','red','beans'];
  return darkBgKeys.includes(colorKey) ? '#ffffff' : '#1c1e21';
}


function autoScrollIfNearEdge(clientY){
  const margin = 70;
  if(clientY > window.innerHeight - margin){
    window.scrollBy(0, 18);
  }else if(clientY < margin && window.scrollY>0){
    window.scrollBy(0, -18);
  }
}

function attachDragHandlers(boxEl, item, canvasGetter, scale, onCommit){
  scale = scale || 1;
  let dragging=false, startClientX=0, startClientY=0, startX=0, startY=0, rect=null, moved=false;
  function pointerDown(e){
    if(e.target.classList.contains('resize-handle')) return;
    e.stopPropagation();
    dragging = true; moved=false;
    const pt = e.touches? e.touches[0] : e;
    startClientX = pt.clientX; startClientY = pt.clientY;
    startX = item.x; startY = item.y;
    rect = canvasGetter().getBoundingClientRect();
    document.addEventListener('mousemove', pointerMove);
    document.addEventListener('mouseup', pointerUp);
    document.addEventListener('touchmove', pointerMove, {passive:false});
    document.addEventListener('touchend', pointerUp);
  }
  function pointerMove(e){
    if(!dragging) return;
    if(e.cancelable) e.preventDefault();
    const pt = e.touches? e.touches[0] : e;
    autoScrollIfNearEdge(pt.clientY);
    const dx = pt.clientX - startClientX;
    const dy = pt.clientY - startClientY;
    if(Math.abs(dx)>3 || Math.abs(dy)>3) moved = true;
    const dxPct = (dx/rect.width)*100;
    let nx = Math.max(0, Math.min(100-item.w, startX+dxPct));
    let ny = Math.max(0, startY+dy/scale);
    item.x = nx; item.y = ny;
    boxEl.style.left = nx+'%';
    boxEl.style.top = (ny*scale)+'px';
  }
  function pointerUp(){
    dragging=false;
    document.removeEventListener('mousemove', pointerMove);
    document.removeEventListener('mouseup', pointerUp);
    document.removeEventListener('touchmove', pointerMove);
    document.removeEventListener('touchend', pointerUp);
    onCommit(moved);
  }
  boxEl.addEventListener('mousedown', pointerDown);
  boxEl.addEventListener('touchstart', pointerDown, {passive:true});
}

function attachResizeHandlers(handleEl, item, canvasGetter, scale, onCommit){
  scale = scale || 1;
  let resizing=false, startClientX=0, startClientY=0, startW=0, startH=0, rect=null;
  function pointerDown(e){
    e.stopPropagation();
    resizing=true;
    const pt = e.touches? e.touches[0]: e;
    startClientX=pt.clientX; startClientY=pt.clientY;
    startW=item.w; startH=item.h;
    rect = canvasGetter().getBoundingClientRect();
    document.addEventListener('mousemove', pointerMove);
    document.addEventListener('mouseup', pointerUp);
    document.addEventListener('touchmove', pointerMove, {passive:false});
    document.addEventListener('touchend', pointerUp);
  }
  function pointerMove(e){
    if(!resizing) return;
    if(e.cancelable) e.preventDefault();
    const pt = e.touches? e.touches[0]: e;
    autoScrollIfNearEdge(pt.clientY);
    const dx = pt.clientX - startClientX;
    const dy = pt.clientY - startClientY;
    const dwPct = (dx/rect.width)*100;
    let nw = Math.max(8, Math.min(100-item.x, startW+dwPct));
    let nh = Math.max(30, startH+dy/scale);
    item.w = nw; item.h = nh;
    const box = handleEl.parentElement;
    box.style.width = nw+'%';
    box.style.height = (nh*scale)+'px';
  }
  function pointerUp(){
    resizing=false;
    document.removeEventListener('mousemove', pointerMove);
    document.removeEventListener('mouseup', pointerUp);
    document.removeEventListener('touchmove', pointerMove);
    document.removeEventListener('touchend', pointerUp);
    onCommit();
  }
  handleEl.addEventListener('mousedown', pointerDown);
  handleEl.addEventListener('touchstart', pointerDown, {passive:true});
}

function intervalToText(leftInf,leftOpen,leftValue,rightInf,rightOpen,rightValue){
  const leftBracket = leftInf ? '(' : (leftOpen?'(':'[');
  const leftVal = leftInf ? '-∞' : leftValue;
  const rightBracket = rightInf ? ')' : (rightOpen?')':']');
  const rightVal = rightInf ? '∞' : rightValue;
  return leftBracket+leftVal+', '+rightVal+rightBracket;
}
function answerDisplayText(q, given){
  const type = q.type||'mc';
  if(type==='short') return (given!==undefined && given!=='') ? given : '(sin responder)';
  if(type==='point') return (given && given.x!==undefined) ? '('+given.x+', '+given.y+')' : '(sin responder)';
  if(type==='slider') return (given!==undefined && given!==null) ? (q.sliderParam+' = '+given) : '(sin responder)';
  if(type==='classify') return (given!==undefined) ? (given===0?(q.labelTrue||'Verdadero'):(q.labelFalse||'Falso')) : '(sin responder)';
  if(type==='multi'){
    if(!given || !given.length) return '(sin responder)';
    return given.map(i=> q.options[i]?q.options[i].text:'?').join(', ');
  }
  if(type==='order'){
    if(!given || !given.length) return '(sin responder)';
    const items = q.items || q.displayItems;
    return given.map(i=> items[i]!==undefined?items[i]:'?').join(' → ');
  }
  if(type==='interval'){
    if(!given) return '(sin responder)';
    return intervalToText(given.leftInf, given.leftOpen, given.leftValue, given.rightInf, given.rightOpen, given.rightValue);
  }
  if(type==='match'){
    if(!given || Object.keys(given).length===0) return '(sin responder)';
    return q.pairs.map((p,i)=> given[i]!==undefined ? p.left+' = '+(q.pairs[given[i]]?q.pairs[given[i]].right:'?') : p.left+' = ?').join(', ');
  }
  return (given!==undefined && q.options[given]) ? q.options[given].text : '(sin responder)';
}
function correctAnswerDisplayText(q){
  const type = q.type||'mc';
  if(type==='short') return (q.acceptedAnswers||[]).join(' / ');
  if(type==='point') return '('+q.correctX+', '+q.correctY+')';
  if(type==='slider') return q.sliderParam+' = '+q.correctValue;
  if(type==='classify') return q.correctIndex===0?(q.labelTrue||'Verdadero'):(q.labelFalse||'Falso');
  if(type==='multi') return (q.correctIndexes||[]).map(i=> q.options[i]?q.options[i].text:'?').join(', ');
  if(type==='order') return (q.items||[]).join(' → ');
  if(type==='interval') return intervalToText(q.correctLeftInf, q.correctLeftOpen, q.correctLeftValue, q.correctRightInf, q.correctRightOpen, q.correctRightValue);
  if(type==='match') return q.pairs.map(p=> p.left+' = '+p.right).join(', ');
  return q.options[q.correctIndex] ? q.options[q.correctIndex].text : '';
}
function correctTextForDisplayQuestion(q){
  const type = q.type||'mc';
  if(type==='short') return (q.acceptedAnswers||[]).join(' / ');
  if(type==='point') return '('+q.correctX+', '+q.correctY+')';
  if(type==='slider') return q.sliderParam+' = '+q.correctValue;
  if(type==='classify') return q.correctIndex===0?(q.labelTrue||'Verdadero'):(q.labelFalse||'Falso');
  if(type==='multi') return q.correctIndexes.map(i=> (q.displayOptions[q.indexMap.indexOf(i)]||{}).text).join(', ');
  if(type==='order') return q.displayItems.map((_,pos)=>pos).map(pos=> q.displayItems[q.indexMap.indexOf(pos)]).join(' → ');
  if(type==='interval') return intervalToText(q.correctLeftInf, q.correctLeftOpen, q.correctLeftValue, q.correctRightInf, q.correctRightOpen, q.correctRightValue);
  if(type==='match') return q.lefts.map((l,i)=> l+' = '+q.displayRights[q.rightIndexMap.indexOf(i)]).join(', ');
  const opt = q.displayOptions[q.indexMap.indexOf(q.correctIndex)];
  return opt ? opt.text : '';
}

function parseBulkQuestions(text){
  const blocks = text.split(/\n\s*\n/).map(b=>b.trim()).filter(b=>b);
  const questions = [];
  const errors = [];
  blocks.forEach((block, bi)=>{
    const lines = block.split('\n').map(l=>l.trim()).filter(l=>l);
    if(lines.length<3){ errors.push('Bloque '+(bi+1)+': muy corto'); return; }
    let qText = lines[0].replace(/^pregunta:\s*/i,'');
    let points = 1;
    let note = '';
    const optionLines = [];
    lines.slice(1).forEach(line=>{
      const ptsMatch = line.match(/^puntos:\s*(\d+)/i);
      if(ptsMatch){ points = Number(ptsMatch[1]); return; }
      const noteMatch = line.match(/^nota:\s*(.+)/i);
      if(noteMatch){ note = noteMatch[1]; return; }
      optionLines.push(line);
    });
    if(optionLines.length<2){ errors.push('Bloque '+(bi+1)+': necesita al menos 2 opciones'); return; }
    let correctIndex = -1;
    const options = optionLines.map((line, i)=>{
      if(line.startsWith('*')){ correctIndex = i; return {text: line.slice(1).trim()}; }
      return {text: line};
    });
    if(correctIndex===-1){ errors.push('Bloque '+(bi+1)+': marca la opcion correcta con *'); return; }
    questions.push({ id:uid(), type:'mc', text:qText, note, image:'', points, options, correctIndex });
  });
  return {questions, errors};
}

function buildQuestionEditorBody(qCard, q){
    const typeQF = el('div',{class:'field'});

    typeQSel.appendChild(el('option',{value:'mc'},'Opcion multiple'));

    typeQSel.appendChild(el('option',{value:'point'},'Punto en cuadricula'));
    typeQSel.appendChild(el('option',{value:'slider'},'Control deslizante (grafica en vivo)'));
    typeQSel.appendChild(el('option',{value:'match'},'Relacionar pares'));
    typeQSel.appendChild(el('option',{value:'multi'},'Seleccion multiple (varias correctas)'));
    typeQSel.appendChild(el('option',{value:'classify'},'Clasificacion (Verdadero/Falso)'));
    typeQSel.appendChild(el('option',{value:'order'},'Ordenamiento (pasos en secuencia)'));
    typeQSel.appendChild(el('option',{value:'interval'},'Intervalo'));
    typeQSel.value = q.type || 'mc';
    typeQSel.onchange = ()=>{
      q.type = typeQSel.value;
      if((q.type==='short') && !q.acceptedAnswers) q.acceptedAnswers = [''];
      if((q.type==='mc'||q.type==='drag'||q.type==='multi') && !q.options) q.options = [{text:''},{text:''}];
      if(q.type==='multi' && !q.correctIndexes) q.correctIndexes = [];
      if(q.type==='classify'){
        if(!q.labelTrue) q.labelTrue='Verdadero';
        if(!q.labelFalse) q.labelFalse='Falso';
        if(q.correctIndex===undefined) q.correctIndex=0;
      }
      if(q.type==='order' && !q.items) q.items = ['Paso 1','Paso 2','Paso 3'];
      if(q.type==='interval'){
        if(q.correctLeftValue===undefined) q.correctLeftValue=0;
        if(q.correctRightValue===undefined) q.correctRightValue=1;
        if(q.correctLeftOpen===undefined) q.correctLeftOpen=true;
        if(q.correctRightOpen===undefined) q.correctRightOpen=true;
        if(q.correctLeftInf===undefined) q.correctLeftInf=false;
        if(q.correctRightInf===undefined) q.correctRightInf=false;
        if(q.tolerance===undefined) q.tolerance=0.01;
      }
      if(q.type==='point'){
        if(q.gridMin===undefined) q.gridMin=-10;
        if(q.gridMax===undefined) q.gridMax=10;
        if(q.correctX===undefined) q.correctX=0;
        if(q.correctY===undefined) q.correctY=0;
        if(q.tolerance===undefined) q.tolerance=0.6;
      }
      if(q.type==='slider'){
        if(!q.funcType) q.funcType='linear';
        if(!q.fixedParams) q.fixedParams={m:1,b:0};
        if(!q.sliderParam) q.sliderParam='m';
        if(q.sliderMin===undefined) q.sliderMin=-5;
        if(q.sliderMax===undefined) q.sliderMax=5;
        if(q.correctValue===undefined) q.correctValue=2;
        if(q.tolerance===undefined) q.tolerance=0.3;
        if(q.gridMin===undefined) q.gridMin=-10;
        if(q.gridMax===undefined) q.gridMax=10;
      }
      if(q.type==='match' && !q.pairs) q.pairs = [{left:'',right:''},{left:'',right:''}];
      render();
    };
    typeQF.appendChild(typeQSel);
    qCard.appendChild(typeQF);

    const type = q.type||'mc';
    if(type==='short'){
      qCard.appendChild(el('label',{},'Respuestas aceptadas (una por linea; cualquiera de ellas se califica correcta)'));
      const ansTa = el('textarea',{rows:3});
      ansTa.value = (q.acceptedAnswers||['']).join('\n');
      ansTa.oninput = ()=>{ q.acceptedAnswers = ansTa.value.split('\n'); };
      ansTa.addEventListener('blur', ()=>{ q.acceptedAnswers = ansTa.value.split('\n').map(s=>s.trim()).filter(s=>s); if(q.acceptedAnswers.length===0) q.acceptedAnswers=['']; });
      qCard.appendChild(ansTa);
    }else if(type==='point'){
      const rangeRow = el('div',{class:'row'});
      const minI = el('input',{type:'number',style:'width:70px;'}); minI.value = q.gridMin;
      minI.onchange = ()=>{ q.gridMin = Number(minI.value); render(); };
      const maxI = el('input',{type:'number',style:'width:70px;'}); maxI.value = q.gridMax;
      maxI.onchange = ()=>{ q.gridMax = Number(maxI.value); render(); };
      rangeRow.appendChild(el('label',{style:'margin:0;'},'Rango:')); rangeRow.appendChild(minI); rangeRow.appendChild(el('span',{},'a')); rangeRow.appendChild(maxI);
      qCard.appendChild(rangeRow);

      const tolRow = el('div',{class:'row',style:'margin-top:8px;'});
      tolRow.appendChild(el('label',{style:'margin:0;'},'Tolerancia:'));
      const tolI = el('input',{type:'number',step:'0.1',min:'0',style:'width:70px;'}); tolI.value = q.tolerance;
      tolI.onchange = ()=>{ q.tolerance = Number(tolI.value); render(); };
      tolRow.appendChild(tolI);
      qCard.appendChild(tolRow);

      qCard.appendChild(el('p',{class:'muted',style:'margin-top:8px;'},'Toca la cuadricula para marcar el punto correcto:'));
      qCard.appendChild(buildPointGrid({
        gridMin:q.gridMin, gridMax:q.gridMax,
        value:{x:q.correctX,y:q.correctY}, draggable:true,
        onPick:(x,y)=>{ q.correctX=x; q.correctY=y; }
      }));
    }else if(type==='slider'){
      const funcRow = el('div',{class:'row'});
      funcRow.appendChild(el('label',{style:'margin:0;'},'Tipo de funcion:'));
      const funcSel = el('select');
      funcSel.appendChild(el('option',{value:'linear'},'Lineal (y = m x + b)'));
      funcSel.appendChild(el('option',{value:'quadratic'},'Cuadratica (y = a x^2 + b x + c)'));
      funcSel.value = q.funcType||'linear';
      funcSel.onchange = ()=>{
        q.funcType = funcSel.value;
        q.fixedParams = q.funcType==='quadratic' ? {a:1,b:0,c:0} : {m:1,b:0};
        q.sliderParam = q.funcType==='quadratic' ? 'a' : 'm';
        render();
      };
      funcRow.appendChild(funcSel);
      qCard.appendChild(funcRow);

      const paramKeys = q.funcType==='quadratic' ? ['a','b','c'] : ['m','b'];
      const sliderParamRow = el('div',{class:'row',style:'margin-top:8px;'});
      sliderParamRow.appendChild(el('label',{style:'margin:0;'},'Parametro que controla el deslizador:'));
      const spSel = el('select');
      paramKeys.forEach(k=>{ const opt=el('option',{value:k},k); if(q.sliderParam===k) opt.setAttribute('selected','selected'); spSel.appendChild(opt); });
      spSel.onchange = ()=>{ q.sliderParam = spSel.value; render(); };
      sliderParamRow.appendChild(spSel);
      qCard.appendChild(sliderParamRow);

      qCard.appendChild(el('p',{class:'muted',style:'margin-top:8px;margin-bottom:2px;'},'Valores fijos de los otros parametros:'));
      const fixedRow = el('div',{class:'row'});
      paramKeys.filter(k=>k!==q.sliderParam).forEach(k=>{
        fixedRow.appendChild(el('label',{style:'margin:0;'},k+':'));
        const inp = el('input',{type:'number',step:'0.1',style:'width:60px;'});
        inp.value = q.fixedParams[k]!==undefined?q.fixedParams[k]:0;
        inp.onchange = ()=>{ q.fixedParams[k]=Number(inp.value); render(); };
        fixedRow.appendChild(inp);
      });
      qCard.appendChild(fixedRow);

      const rangeRow2 = el('div',{class:'row',style:'margin-top:8px;'});
      rangeRow2.appendChild(el('label',{style:'margin:0;'},'Rango del control:'));
      const sMinI = el('input',{type:'number',step:'0.1',style:'width:60px;'}); sMinI.value=q.sliderMin;
      sMinI.onchange=()=>{ q.sliderMin=Number(sMinI.value); render(); };
      const sMaxI = el('input',{type:'number',step:'0.1',style:'width:60px;'}); sMaxI.value=q.sliderMax;
      sMaxI.onchange=()=>{ q.sliderMax=Number(sMaxI.value); render(); };
      rangeRow2.appendChild(sMinI); rangeRow2.appendChild(el('span',{},'a')); rangeRow2.appendChild(sMaxI);
      qCard.appendChild(rangeRow2);

      const correctRow = el('div',{class:'row',style:'margin-top:8px;'});
      correctRow.appendChild(el('label',{style:'margin:0;'},'Valor correcto:'));
      const cvI = el('input',{type:'number',step:'0.1',style:'width:60px;'}); cvI.value=q.correctValue;
      cvI.onchange=()=>{ q.correctValue=Number(cvI.value); render(); };
      correctRow.appendChild(cvI);
      correctRow.appendChild(el('label',{style:'margin:0 0 0 12px;'},'Tolerancia:'));
      const tolI2 = el('input',{type:'number',step:'0.05',min:'0',style:'width:60px;'}); tolI2.value=q.tolerance;
      tolI2.onchange=()=>{ q.tolerance=Number(tolI2.value); render(); };
      correctRow.appendChild(tolI2);
      qCard.appendChild(correctRow);

      const gridRow2 = el('div',{class:'row',style:'margin-top:8px;'});
      gridRow2.appendChild(el('label',{style:'margin:0;'},'Rango de la grafica:'));
      const gMinI=el('input',{type:'number',style:'width:60px;'}); gMinI.value=q.gridMin;
      gMinI.onchange=()=>{ q.gridMin=Number(gMinI.value); render(); };
      const gMaxI=el('input',{type:'number',style:'width:60px;'}); gMaxI.value=q.gridMax;
      gMaxI.onchange=()=>{ q.gridMax=Number(gMaxI.value); render(); };
      gridRow2.appendChild(gMinI); gridRow2.appendChild(el('span',{},'a')); gridRow2.appendChild(gMaxI);
      qCard.appendChild(gridRow2);

      qCard.appendChild(el('p',{class:'muted',style:'margin-top:8px;'},'Vista previa (la linea punteada verde marca la posicion correcta):'));
      qCard.appendChild(buildSliderGraph({
        funcType:q.funcType, fixedParams:q.fixedParams, sliderParam:q.sliderParam,
        sliderMin:q.sliderMin, sliderMax:q.sliderMax, value:q.correctValue,
        gridMin:q.gridMin, gridMax:q.gridMax, showCorrectValue:q.correctValue,
        onChange:()=>{}
      }));
    }else if(type==='match'){
      qCard.appendChild(el('label',{},'Pares (izquierda / derecha correcta)'));
      q.pairs.forEach((p, pi)=>{
        const row = el('div',{class:'row',style:'margin-bottom:6px;'});
        const leftI = el('input',{type:'text',placeholder:'Elemento'}); leftI.value=p.left;
        leftI.oninput = ()=>{ p.left = leftI.value; };
        const rightI = el('input',{type:'text',placeholder:'Pareja correcta'}); rightI.value=p.right;
        rightI.oninput = ()=>{ p.right = rightI.value; };
        const delBtn = el('button',{class:'small ghost'},'x');
        delBtn.onclick = ()=>{ q.pairs.splice(pi,1); render(); };
        row.appendChild(leftI); row.appendChild(rightI); row.appendChild(delBtn);
        qCard.appendChild(row);
      });
      const addPairBtn = el('button',{class:'small'},'+ Agregar par');
      addPairBtn.onclick = ()=>{ q.pairs.push({left:'',right:''}); render(); };
      qCard.appendChild(addPairBtn);
    }else if(type==='multi'){
      qCard.appendChild(el('label',{},'Opciones (marca todas las que sean correctas)'));
      if(!q.correctIndexes) q.correctIndexes = [];
      (q.options||[]).forEach((opt, oi)=>{
        const optRow = el('div',{class:'qopt'});
        const cb = el('input',{type:'checkbox'});
        cb.checked = q.correctIndexes.includes(oi);
        cb.onchange = ()=>{
          if(cb.checked){ if(!q.correctIndexes.includes(oi)) q.correctIndexes.push(oi); }
          else{ q.correctIndexes = q.correctIndexes.filter(i=>i!==oi); }
        };
        const optI = el('input',{type:'text'}); optI.value = opt.text; optI.placeholder='Texto de la opcion';
        optI.oninput = ()=>{ opt.text = optI.value; };
        const imgBtn = el('input',{type:'file',accept:'image/*',style:'width:110px;font-size:11px;'});
        imgBtn.onchange = ()=>{ handleImageFileCompressedToMedia(imgBtn.files[0], (ref)=>{ opt.image=ref; render(); }); };
        const delOptBtn = el('button',{class:'small ghost'},'x');
        delOptBtn.onclick = ()=>{ q.options.splice(oi,1); q.correctIndexes = q.correctIndexes.filter(i=>i!==oi).map(i=>i>oi?i-1:i); render(); };
        optRow.appendChild(cb); optRow.appendChild(optI); optRow.appendChild(imgBtn); optRow.appendChild(delOptBtn);
        if(opt.image) optRow.appendChild(mediaImg(opt.image,{style:'max-width:50px;max-height:40px;border-radius:4px;'}));
        qCard.appendChild(optRow);
      });
      const addOptBtn2 = el('button',{class:'small'},'+ Agregar opcion');
      addOptBtn2.onclick = ()=>{ q.options.push({text:''}); render(); };
      qCard.appendChild(addOptBtn2);
    }else if(type==='classify'){
      const labelRow = el('div',{class:'row'});
      const labelTrueI = el('input',{type:'text',placeholder:'Etiqueta A (ej. Verdadero)'}); labelTrueI.value = q.labelTrue||'Verdadero';
      labelTrueI.oninput = ()=>{ q.labelTrue = labelTrueI.value; };
      const labelFalseI = el('input',{type:'text',placeholder:'Etiqueta B (ej. Falso)'}); labelFalseI.value = q.labelFalse||'Falso';
      labelFalseI.oninput = ()=>{ q.labelFalse = labelFalseI.value; };
      labelRow.appendChild(labelTrueI); labelRow.appendChild(labelFalseI);
      qCard.appendChild(labelRow);
      qCard.appendChild(el('label',{style:'margin-top:8px;'},'¿Cual es la correcta?'));
      const corRow = el('div',{class:'row'});
      const r1 = el('label',{style:'display:flex;align-items:center;gap:6px;'});
      const rb1 = el('input',{type:'radio',name:'classify-'+q.id}); rb1.checked = (q.correctIndex||0)===0; rb1.onchange=()=>{ q.correctIndex=0; };
      r1.appendChild(rb1); r1.appendChild(document.createTextNode(q.labelTrue||'Verdadero'));
      const r2 = el('label',{style:'display:flex;align-items:center;gap:6px;'});
      const rb2 = el('input',{type:'radio',name:'classify-'+q.id}); rb2.checked = q.correctIndex===1; rb2.onchange=()=>{ q.correctIndex=1; };
      r2.appendChild(rb2); r2.appendChild(document.createTextNode(q.labelFalse||'Falso'));
      corRow.appendChild(r1); corRow.appendChild(r2);
      qCard.appendChild(corRow);
    }else if(type==='order'){
      qCard.appendChild(el('label',{},'Elementos en el orden correcto (de arriba a abajo)'));
      q.items.forEach((it, ii)=>{
        const row = el('div',{class:'row',style:'margin-bottom:6px;'});
        row.appendChild(el('span',{class:'muted'}, (ii+1)+'.'));
        const itI = el('input',{type:'text'}); itI.value = it;
        itI.oninput = ()=>{ q.items[ii] = itI.value; };
        const upBtn = el('button',{class:'small ghost'},'↑'); upBtn.disabled = ii===0;
        upBtn.onclick = ()=>{ const t=q.items[ii-1]; q.items[ii-1]=q.items[ii]; q.items[ii]=t; render(); };
        const downBtn = el('button',{class:'small ghost'},'↓'); downBtn.disabled = ii===q.items.length-1;
        downBtn.onclick = ()=>{ const t=q.items[ii+1]; q.items[ii+1]=q.items[ii]; q.items[ii]=t; render(); };
        const delBtn = el('button',{class:'small ghost'},'x');
        delBtn.onclick = ()=>{ q.items.splice(ii,1); render(); };
        row.appendChild(itI); row.appendChild(upBtn); row.appendChild(downBtn); row.appendChild(delBtn);
        qCard.appendChild(row);
      });
      const addItemBtn = el('button',{class:'small'},'+ Agregar elemento');
      addItemBtn.onclick = ()=>{ q.items.push('Nuevo paso'); render(); };
      qCard.appendChild(addItemBtn);
    }else if(type==='interval'){
      const row1 = el('div',{class:'row'});
      const leftBrSel = el('select',{style:'width:auto;'});
      leftBrSel.appendChild(el('option',{value:'open'},'( abierto'));
      leftBrSel.appendChild(el('option',{value:'closed'},'[ cerrado'));
      leftBrSel.appendChild(el('option',{value:'inf'},'-∞'));
      leftBrSel.value = q.correctLeftInf?'inf':(q.correctLeftOpen?'open':'closed');
      leftBrSel.onchange = ()=>{ q.correctLeftInf = leftBrSel.value==='inf'; q.correctLeftOpen = leftBrSel.value==='open'; render(); };
      const leftValI = el('input',{type:'number',style:'width:70px;'}); leftValI.value=q.correctLeftValue; leftValI.disabled=q.correctLeftInf;
      leftValI.onchange = ()=>{ q.correctLeftValue=Number(leftValI.value); };
      row1.appendChild(leftBrSel); row1.appendChild(leftValI); row1.appendChild(el('span',{},','));
      const rightValI = el('input',{type:'number',style:'width:70px;'}); rightValI.value=q.correctRightValue; rightValI.disabled=q.correctRightInf;
      rightValI.onchange = ()=>{ q.correctRightValue=Number(rightValI.value); };
      const rightBrSel = el('select',{style:'width:auto;'});
      rightBrSel.appendChild(el('option',{value:'open'},') abierto'));
      rightBrSel.appendChild(el('option',{value:'closed'},'] cerrado'));
      rightBrSel.appendChild(el('option',{value:'inf'},'+∞'));
      rightBrSel.value = q.correctRightInf?'inf':(q.correctRightOpen?'open':'closed');
      rightBrSel.onchange = ()=>{ q.correctRightInf = rightBrSel.value==='inf'; q.correctRightOpen = rightBrSel.value==='open'; render(); };
      row1.appendChild(rightValI); row1.appendChild(rightBrSel);
      qCard.appendChild(row1);
      const tolRow2 = el('div',{class:'row',style:'margin-top:8px;'});
      tolRow2.appendChild(el('label',{style:'margin:0;'},'Tolerancia:'));
      const tolI3 = el('input',{type:'number',step:'0.01',min:'0',style:'width:70px;'}); tolI3.value=q.tolerance;
      tolI3.onchange = ()=>{ q.tolerance=Number(tolI3.value); };
      tolRow2.appendChild(tolI3);
      qCard.appendChild(tolRow2);
    }else{
      qCard.appendChild(el('label',{}, type==='drag' ? 'Opciones (marca cual es la correcta para arrastrar)' : 'Opciones (marca la correcta)'));
      (q.options||[]).forEach((opt, oi)=>{
        const optRow = el('div',{class:'qopt'});
        const radio = el('input',{type:'radio',name:'correct-'+q.id});
        radio.checked = q.correctIndex===oi;
        radio.onchange = ()=>{ q.correctIndex = oi; };
        const optI = el('input',{type:'text'}); optI.value = opt.text; optI.placeholder='Texto de la opcion';
        optI.oninput = ()=>{ opt.text = optI.value; };
        const imgBtn2 = el('input',{type:'file',accept:'image/*',style:'width:110px;font-size:11px;'});
        imgBtn2.onchange = ()=>{ handleImageFileCompressedToMedia(imgBtn2.files[0], (ref)=>{ opt.image=ref; render(); }); };
        const delOptBtn = el('button',{class:'small ghost'},'x');
        delOptBtn.onclick = ()=>{ q.options.splice(oi,1); if(q.correctIndex>=q.options.length) q.correctIndex=0; render(); };
        optRow.appendChild(radio); optRow.appendChild(optI); optRow.appendChild(imgBtn2); optRow.appendChild(delOptBtn);
        if(opt.image) optRow.appendChild(mediaImg(opt.image,{style:'max-width:50px;max-height:40px;border-radius:4px;'}));
        qCard.appendChild(optRow);
      });
      const addOptBtn = el('button',{class:'small'},'+ Agregar opcion');
      addOptBtn.onclick = ()=>{ q.options.push({text:''}); render(); };
      qCard.appendChild(addOptBtn);
    }

    qCard.appendChild(el('hr',{class:'divider'}));
    qCard.appendChild(el('label',{},'Pistas (opcional, una por linea, se muestran progresivamente si el alumno las pide)'));
    const hintsTa = el('textarea',{rows:2});
    hintsTa.value = (q.hints||[]).join('\n');
    hintsTa.addEventListener('blur', ()=>{ q.hints = hintsTa.value.split('\n').map(s=>s.trim()).filter(s=>s); });
    qCard.appendChild(hintsTa);

    qCard.appendChild(el('hr',{class:'divider'}));
    const dynToggleRow = el('div',{class:'row'});
    const dynToggle = el('input',{type:'checkbox'}); dynToggle.checked = !!(q.dynamicVars && q.dynamicVars.length>0);
    dynToggle.onchange = ()=>{
      if(dynToggle.checked){ if(!q.dynamicVars || q.dynamicVars.length===0) q.dynamicVars=[{name:'a',min:1,max:10}]; }
      else{ q.dynamicVars=[]; }
      render();
    };
    dynToggleRow.appendChild(dynToggle);
    dynToggleRow.appendChild(el('label',{style:'margin:0;'},'Usar variables aleatorias (pregunta dinamica)'));
    qCard.appendChild(dynToggleRow);
    qCard.appendChild(el('p',{class:'muted',style:'margin-top:4px;'},'Escribe {nombre} en el texto (o en las respuestas de tipo corta) y el sistema calculara el valor. Ej: texto "Cuanto es {a} + {b}?" y respuesta aceptada "{a+b}".'));
    if(dynToggle.checked){
      q.dynamicVars.forEach((v, vi)=>{
        const vRow = el('div',{class:'row',style:'margin-bottom:6px;'});
        const nameI = el('input',{type:'text',placeholder:'nombre',style:'width:70px;'}); nameI.value=v.name;
        nameI.oninput = ()=>{ v.name = nameI.value; };
        const minI2 = el('input',{type:'number',placeholder:'min',style:'width:60px;'}); minI2.value=v.min;
        minI2.onchange = ()=>{ v.min = Number(minI2.value); };
        const maxI2 = el('input',{type:'number',placeholder:'max',style:'width:60px;'}); maxI2.value=v.max;
        maxI2.onchange = ()=>{ v.max = Number(maxI2.value); };
        const delVBtn = el('button',{class:'small ghost'},'x');
        delVBtn.onclick = ()=>{ q.dynamicVars.splice(vi,1); render(); };
        vRow.appendChild(el('span',{},'{')); vRow.appendChild(nameI); vRow.appendChild(el('span',{},'}'));
        vRow.appendChild(el('span',{class:'muted'},'entre')); vRow.appendChild(minI2); vRow.appendChild(el('span',{class:'muted'},'y')); vRow.appendChild(maxI2);
        vRow.appendChild(delVBtn);
        qCard.appendChild(vRow);
      });
      const addVarBtn = el('button',{class:'small'},'+ Agregar variable');
      addVarBtn.onclick = ()=>{ q.dynamicVars.push({name:String.fromCharCode(97+q.dynamicVars.length), min:1, max:10}); render(); };
      qCard.appendChild(addVarBtn);
    }
}

function renderActivityEditor(container){
  const act = editingActivity;
  container.appendChild(sectionHead(act.__isNew? 'Nueva actividad':'Editar actividad'));
  const card = el('div',{class:'card'});

  const nameF = el('div',{class:'field'});
  nameF.appendChild(el('label',{},'Nombre de la actividad'));
  const nameI = el('input',{type:'text'}); nameI.value = act.name;
  nameI.oninput = ()=>{ act.name = nameI.value; };
  nameF.appendChild(nameI);
  card.appendChild(nameF);

  const typeF = el('div',{class:'field'});
  typeF.appendChild(el('label',{},'Tipo de actividad'));
  const typeSel = el('select');
  typeSel.appendChild(el('option',{value:'work'},'Trabajo (hasta 3 intentos, se guarda el mejor puntaje)'));
  typeSel.appendChild(el('option',{value:'exam'},'Examen (con limite de tiempo, un intento)'));
  typeSel.value = act.type;
  typeSel.onchange = ()=>{ act.type = typeSel.value; render(); };
  typeF.appendChild(typeSel);
  card.appendChild(typeF);

  if(act.type==='exam'){
    const tlF = el('div',{class:'field'});
    tlF.appendChild(el('label',{},'Tiempo limite (minutos)'));
    const tlI = el('input',{type:'number',min:'1'}); tlI.value = act.timeLimitMinutes || 10;
    tlI.oninput = ()=>{ act.timeLimitMinutes = Number(tlI.value); };
    tlF.appendChild(tlI);
    card.appendChild(tlF);
  }

  const availF = el('div',{class:'field'});
  availF.appendChild(el('label',{},'Disponible hasta (opcional)'));
  const availI = el('input',{type:'datetime-local'});
  if(act.availableUntil) availI.value = act.availableUntil.slice(0,16);
  availI.oninput = ()=>{ act.availableUntil = availI.value ? new Date(availI.value).toISOString() : ''; };
  availF.appendChild(availI);
  availF.appendChild(el('div',{class:'muted'},'Despues de esta fecha y hora, el alumno ya no podra iniciarla y desaparecera de su lista de actividades pendientes (pero seguira viendo su resultado en su Perfil). Tu siempre conservas acceso a resultados y puedes reasignarla.'));
  card.appendChild(availF);

  card.appendChild(el('hr',{class:'divider'}));
  card.appendChild(el('h3',{},'Preguntas (opcion multiple)'));

  act.questions.forEach((q, qi)=>{
    const qCard = el('div',{class:'card',style:'background:var(--bg);',draggable:'true'});
    qCard.ondragstart = (e)=>{ e.dataTransfer.setData('text/plain', String(qi)); e.dataTransfer.effectAllowed='move'; qCard.style.opacity='.5'; };
    qCard.ondragend = ()=>{ qCard.style.opacity='1'; };
    qCard.ondragover = (e)=>{ e.preventDefault(); };
    qCard.ondrop = (e)=>{
      e.preventDefault();
      const fromIdx = Number(e.dataTransfer.getData('text/plain'));
      if(isNaN(fromIdx) || fromIdx===qi) return;
      const moved = act.questions.splice(fromIdx,1)[0];
      act.questions.splice(qi,0,moved);
      render();
    };
    const qHead = el('div',{class:'row-between'});
    const qHeadLeft = el('div',{class:'row'});
    qHeadLeft.appendChild(el('span',{style:'cursor:grab;font-size:16px;color:var(--muted);',title:'Arrastra para reordenar'},'☰'));
    qHeadLeft.appendChild(el('div',{style:'font-weight:700;'},'Pregunta '+(qi+1)));
    qHead.appendChild(qHeadLeft);
    const qHeadBtns = el('div',{class:'row'});
    const upBtn = el('button',{class:'small ghost'},'↑');
    upBtn.disabled = qi===0;
    upBtn.onclick = ()=>{ if(qi>0){ const tmp=act.questions[qi-1]; act.questions[qi-1]=act.questions[qi]; act.questions[qi]=tmp; render(); } };
    const downBtn = el('button',{class:'small ghost'},'↓');
    downBtn.disabled = qi===act.questions.length-1;
    downBtn.onclick = ()=>{ if(qi<act.questions.length-1){ const tmp=act.questions[qi+1]; act.questions[qi+1]=act.questions[qi]; act.questions[qi]=tmp; render(); } };
    const delQBtn = el('button',{class:'danger small'},'Eliminar pregunta');
    delQBtn.onclick = ()=>{ act.questions.splice(qi,1); render(); };
    qHeadBtns.appendChild(upBtn); qHeadBtns.appendChild(downBtn); qHeadBtns.appendChild(delQBtn);
    qHead.appendChild(qHeadBtns);
    qCard.appendChild(qHead);

    const qTextF = el('div',{class:'field'});
    qTextF.appendChild(el('label',{},'Texto de la pregunta'));
    const qTextI = el('textarea',{rows:'2'}); qTextI.value = q.text;
    qTextI.oninput = ()=>{ q.text = qTextI.value; };
    qTextF.appendChild(qTextI);
    qCard.appendChild(qTextF);

    const noteF = el('div',{class:'field'});
    noteF.appendChild(el('label',{},'Nota (opcional, aparece mas pequena y tenue debajo de la pregunta)'));
    const noteI = el('input',{type:'text'}); noteI.value = q.note || '';
    noteI.oninput = ()=>{ q.note = noteI.value; };
    noteF.appendChild(noteI);
    qCard.appendChild(noteF);

    const qImgF = el('div',{class:'field fileRow'});
    qImgF.appendChild(el('label',{},'Imagen (opcional)'));
    const qFileI = el('input',{type:'file',accept:'image/*'});
    qFileI.onchange = ()=>{ handleImageFileToMedia(qFileI.files[0], (ref)=>{ q.image = ref; render(); }); };
    qImgF.appendChild(qFileI);
    const qImgI = el('input',{type:'text',placeholder:'...o pega una URL de imagen'}); qImgI.value = q.image || '';
    qImgI.oninput = ()=>{ q.image = qImgI.value; };
    qImgF.appendChild(qImgI);
    if(q.image) qImgF.appendChild(mediaImg(q.image, {style:'max-width:200px;border-radius:8px;margin-top:6px;display:block;'}));
    qCard.appendChild(qImgF);

    const ptsF = el('div',{class:'field'});
    ptsF.appendChild(el('label',{},'Puntos'));
    const ptsI = el('input',{type:'number',min:'0'}); ptsI.value = q.points;
    ptsI.oninput = ()=>{ q.points = Number(ptsI.value); };
    ptsF.appendChild(ptsI);
    qCard.appendChild(ptsF);

    buildQuestionEditorBody(qCard, q);

    card.appendChild(qCard);
  });

  const addQBtn = el('button',{style:'margin-top:8px;'},'+ Agregar pregunta');
  addQBtn.onclick = ()=>{
    act.questions.push({ id:uid(), type:'mc', text:'', note:'', image:'', points:1, options:[{text:''},{text:''}], correctIndex:0 });
    render();
  };
  card.appendChild(addQBtn);

  card.appendChild(el('hr',{class:'divider'}));
  card.appendChild(el('h3',{},'Carga masiva de preguntas'));

        else{ act.assignedTo = act.assignedTo.filter(u=>u!==s.username); }
      };
      chip.appendChild(cb);
      chip.appendChild(document.createTextNode(s.name));
      chipbar.appendChild(chip);

    if(!act.name.trim()){ alert('Ponle un nombre a la actividad.'); return; }
    if(act.questions.length===0){ alert('Agrega al menos una pregunta.'); return; }
    for(const q of act.questions){
      if(!q.text.trim()){ alert('Todas las preguntas necesitan texto.'); return; }
      if(q.options.length<2){ alert('Cada pregunta necesita al menos 2 opciones.'); return; }
      if(q.options.some(o=>!o.text.trim())){ alert('Completa el texto de todas las opciones.'); return; }
    }
    const cat = findCategory(editingCategoryId);
    const existingIdx = cat.activities.findIndex(a=>a.id===act.id);
    const cleanAct = JSON.parse(JSON.stringify(act));
    delete cleanAct.__isNew;
    if(!cleanAct.submissions) cleanAct.submissions = {};
    if(existingIdx>=0) cat.activities[existingIdx] = cleanAct;
    else cat.activities.push(cleanAct);
    saveDB();

    render();
  };

  cancelBtn.onclick = ()=>{ editingActivity=null; render(); };
  saveRow.appendChild(saveBtn); saveRow.appendChild(cancelBtn);
  card.appendChild(saveRow);

  container.appendChild(card);
}

function starsForPct(pct){
  if(pct>=90) return 3;
  if(pct>=70) return 2;
  if(pct>=50) return 1;
  return 0;
}
function buildStarRow(stars){
  const row = el('div',{style:'font-size:18px;letter-spacing:2px;color:var(--yellow);'});
  let str = '';
  for(let i=0;i<3;i++) str += (i<stars ? '★' : '☆');
  row.textContent = str;
  row.style.color = stars>0 ? 'var(--yellow)' : 'var(--border-strong)';
  return row;
}

function renderStudentExercises(container){
  container.appendChild(sectionHead('Ejercicios'));
  container.appendChild(el('p',{class:'muted',style:'margin-top:-10px;'},'Practica libre, sin limite de intentos. No afecta tu calificacion.'));

  const mySections = DB.exerciseSections.filter(sec=> sec.assignedTo.includes(session.username));
  if(mySections.length===0){
    container.appendChild(el('div',{class:'empty'},'Aun no tienes secciones de ejercicios asignadas.'));

  }

  mySections.forEach(sec=>{
    const secWrap = el('div',{});
    secWrap.appendChild(el('h3',{style:'margin-top:6px;'}, sec.name));

    sec.categories.forEach(cat=>{
      if(cat.exercises.length===0) return;
      anyExercise = true;
      secWrap.appendChild(el('div',{class:'muted',style:'font-weight:700;margin:8px 0 4px;'}, cat.name));
      cat.exercises.forEach(ex=>{
        const results = (ex.results && ex.results[session.username]) || [];
        const bestPct = results.length ? Math.max(...results.map(r=>r.pct)) : null;
        const stars = bestPct!==null ? starsForPct(bestPct) : 0;

        const item = el('div',{class:'card'});
        const top = el('div',{class:'row-between'});
        const left = el('div');
        left.appendChild(el('div',{style:'font-weight:700;'}, ex.name));
        left.appendChild(el('div',{class:'muted'}, ex.questions.length+' pregunta(s)'+(results.length? ' . '+results.length+' intento(s) . mejor: '+bestPct+'%':' . sin practicar aun')));
        top.appendChild(left);
        top.appendChild(buildStarRow(stars));
        item.appendChild(top);

        const btnRow = el('div',{class:'row',style:'margin-top:10px;'});
        const startBtn = el('button',{class:'primary small'}, results.length? 'Practicar de nuevo':'Practicar');
        startBtn.onclick = ()=>{ exerciseIntro = ex; render(); };
        btnRow.appendChild(startBtn);
        if(results.length){
          const histBtn = el('button',{class:'small'}, expandedExerciseHistory===ex.id?'Ocultar historial':'Ver historial');
          histBtn.onclick = ()=>{ expandedExerciseHistory = expandedExerciseHistory===ex.id ? null : ex.id; render(); };
          btnRow.appendChild(histBtn);
        }
        item.appendChild(btnRow);

        if(expandedExerciseHistory===ex.id){
          const hist = el('div',{style:'margin-top:10px;'});
          results.slice().reverse().forEach(r=>{
            const row = el('div',{class:'list-item row-between'});
            const d = new Date(r.timestamp);
            row.appendChild(el('div',{class:'muted'}, d.toLocaleDateString('es-MX',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})));
            row.appendChild(el('div',{}, buildStarRow(starsForPct(r.pct)), el('span',{class:'muted',style:'margin-left:8px;'}, r.correctCount+'/'+r.total+' . '+r.pct+'%')));
            hist.appendChild(row);
          });
          item.appendChild(hist);
        }
        secWrap.appendChild(item);
      });
    });
    if(!anyExercise) secWrap.appendChild(el('div',{class:'muted'},'Sin ejercicios todavia en esta seccion.'));
    container.appendChild(secWrap);
  });
}

  const content = el('div',{class:'content'});
  const card = el('div',{class:'card',style:'background:var(--bg);border-color:transparent;box-shadow:none;'});

  card.appendChild(el('h2',{style:'margin:0 0 10px;'}, t.exercise.name));
  const progressDone = t.answered ? t.index+1 : t.index;
  const progressPct = Math.round((progressDone/t.order.length)*100);
  const barTrack = el('div',{style:'height:10px;border-radius:99px;background:var(--border);overflow:hidden;margin-bottom:16px;'});
  barTrack.appendChild(el('div',{style:'height:100%;width:'+progressPct+'%;border-radius:99px;background:linear-gradient(90deg, var(--yellow), var(--orange));transition:width .5s ease;'}));
  card.appendChild(barTrack);

  card.appendChild(el('div',{style:'font-weight:700;margin-bottom:6px;'}, q.text));
  if(q.note) card.appendChild(el('div',{class:'muted',style:'font-size:12px;margin:-4px 0 8px;'}, q.note));
  if(q.image) card.appendChild(mediaImg(q.image, {style:'max-width:100%;border-radius:8px;margin-bottom:10px;display:block;'}));

  if(!t.answered){
    card.appendChild(buildQuestionAnswerWidget(q, t.currentAnswer, (val)=>{ t.currentAnswer = val; }));
    card.appendChild(buildHintsUI(q, t.hintsRevealed||0, (n)=>{ t.hintsRevealed=n; render(); }));
    const checkBtn = el('button',{class:'primary',style:'margin-top:10px;'},'Comprobar');
    checkBtn.onclick = ()=>{
      const correct = isAnswerCorrect(q, t.currentAnswer);
      t.answered = true;
      t.lastCorrect = correct;
      if(correct) t.correctCount++;
      render();
    };
    card.appendChild(checkBtn);
  }else{
    const fb = el('div',{style:'padding:10px;border-radius:8px;margin-top:6px;background:'+(t.lastCorrect?'var(--success-bg)':'var(--danger-bg)')+';color:'+(t.lastCorrect?'var(--success)':'var(--danger)')+';font-weight:700;'},
      t.lastCorrect ? '✓ Correcto' : '✗ Incorrecto . Respuesta correcta: '+correctTextForDisplayQuestion(q));
    card.appendChild(fb);
    const nextBtn = el('button',{class:'primary',style:'margin-top:10px;'}, t.index+1<t.order.length ? 'Siguiente' : 'Ver resultado');
    nextBtn.onclick = ()=>{
      if(t.index+1 < t.order.length){
        t.index++; t.answered=false; t.lastCorrect=null; t.currentAnswer=undefined; t.hintsRevealed=0;
        render();
      }else{
        const pct = t.order.length>0 ? Math.round((t.correctCount/t.order.length)*100) : 0;
        const realEx = findExerciseById(t.exercise.id);
        if(realEx){
          if(!realEx.results) realEx.results = {};
          if(!realEx.results[session.username]) realEx.results[session.username] = [];
          realEx.results[session.username].push({ correctCount:t.correctCount, total:t.order.length, pct, elapsedMs: Date.now()-t.startTime, timestamp: Date.now() });
          saveDB();
        }
        exerciseResultView = { name:t.exercise.name, correctCount:t.correctCount, total:t.order.length, elapsedMs: Date.now()-t.startTime, mascot:t.mascot };
        takingExercise = null;
        render();
      }
    };
    card.appendChild(nextBtn);
  }

  const exitBtn = el('button',{style:'margin-left:8px;'},'Salir');
  exitBtn.onclick = ()=>{ takingExercise=null; render(); };
  card.appendChild(exitBtn);

  content.appendChild(card);
  root.appendChild(content);
}
