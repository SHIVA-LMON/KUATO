function isFinishedForStudent(act, username){
  const subs = (act.submissions && act.submissions[username]) || [];
  if(act.type==='work'){
    if(subs.length>=3) return true;
    const best = bestSubmission(act, username);
    if(best && best.pct>=100) return true;
    return false;
  }
  return subs.length>=1;
}

function pendingActivitiesForStudent(username){
  const pendingActs = [];
  DB.categories.forEach(cat=>{
    cat.activities.forEach(act=>{
      if(!act.assignedTo || !act.assignedTo.includes(username)) return;
      if(isLocked(act)) return;
      if(isFinishedForStudent(act, username)) return;
      pendingActs.push({cat, act});
    });
  });
  return pendingActs;
}

function normalizeAnswer(s){ return (s||'').toString().trim().toLowerCase(); }
function isAnswerCorrect(q, given){
  const type = q.type||'mc';
  if(type==='short'){
    if(given===undefined || given===null || given==='') return false;
    return (q.acceptedAnswers||[]).some(a=> normalizeAnswer(a)===normalizeAnswer(given));
  }
  if(type==='mc' || type==='drag' || type==='classify'){
    return given===q.correctIndex;
  }
  if(type==='point'){
    if(!given || given.x===undefined || given.y===undefined) return false;
    const dx = given.x - q.correctX, dy = given.y - q.correctY;
    return Math.sqrt(dx*dx+dy*dy) <= (q.tolerance!==undefined?q.tolerance:0.6);
  }
  if(type==='match'){
    if(!given) return false;
    const n = q.pairs ? q.pairs.length : (q.lefts ? q.lefts.length : 0);
    if(n===0) return false;
    for(let i=0;i<n;i++){ if(given[i]!==i) return false; }
    return true;
  }
  if(type==='slider'){
    if(given===undefined || given===null) return false;
    return Math.abs(given - q.correctValue) <= (q.tolerance!==undefined?q.tolerance:0.3);
  }
  if(type==='multi'){
    if(!given || !Array.isArray(given)) return false;
    const a = given.slice().sort((x,y)=>x-y);
    const b = (q.correctIndexes||[]).slice().sort((x,y)=>x-y);
    if(a.length!==b.length || a.length===0) return false;
    return a.every((v,i)=>v===b[i]);
  }
  if(type==='order'){
    if(!given || !Array.isArray(given)) return false;
    const n = q.items ? q.items.length : (q.displayItems?q.displayItems.length:0);
    if(given.length!==n || n===0) return false;
    return given.every((v,i)=>v===i);
  }
  if(type==='interval'){
    if(!given) return false;
    const tol = q.tolerance!==undefined?q.tolerance:0.001;
    const leftOk = given.leftInf ? !!q.correctLeftInf : (!q.correctLeftInf && Math.abs(Number(given.leftValue)-Number(q.correctLeftValue))<=tol);
    const rightOk = given.rightInf ? !!q.correctRightInf : (!q.correctRightInf && Math.abs(Number(given.rightValue)-Number(q.correctRightValue))<=tol);
    const leftOpenOk = given.leftInf || given.leftOpen===q.correctLeftOpen;
    const rightOpenOk = given.rightInf || given.rightOpen===q.correctRightOpen;
    return leftOk && rightOk && leftOpenOk && rightOpenOk;
  }
  return given===q.correctIndex;
}

/* ---------- Widget de cuadricula interactiva (tipo punto en plano) ---------- */
function gridToPx(val, gridMin, gridMax, sizePx){ return ((val-gridMin)/(gridMax-gridMin))*sizePx; }
function pxToGrid(px, gridMin, gridMax, sizePx){ return gridMin + (px/sizePx)*(gridMax-gridMin); }

function buildPointGrid(opts){
  // opts: {gridMin, gridMax, value:{x,y}|null, onPick(x,y), draggable, showCorrect:{x,y,tolerance}|null}
  const gridMin = opts.gridMin!==undefined?opts.gridMin:-10;
  const gridMax = opts.gridMax!==undefined?opts.gridMax:10;
  const size = 280;
  const wrap = el('div',{style:'width:100%;max-width:320px;'});
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox','0 0 '+size+' '+size);
  svg.setAttribute('width','100%');
  svg.style.background = '#fff';
  svg.style.border = '1px solid var(--border-strong)';
  svg.style.borderRadius = '10px';
  svg.style.touchAction = 'none';

  function addLine(x1,y1,x2,y2,stroke,width){
    const l = document.createElementNS(svgNS,'line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1); l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke',stroke); l.setAttribute('stroke-width',width);
    svg.appendChild(l);
  }
  // cuadricula
  const step = (gridMax-gridMin) <= 12 ? 1 : Math.ceil((gridMax-gridMin)/12);
  for(let v=gridMin; v<=gridMax; v+=step){
    const p = gridToPx(v, gridMin, gridMax, size);
    addLine(p,0,p,size,'#eee0c2',1);
    addLine(0,p,size,p,'#eee0c2',1);
  }
  // ejes
  if(gridMin<=0 && gridMax>=0){
    const zero = gridToPx(0, gridMin, gridMax, size);
    addLine(zero,0,zero,size,'#c9c0a0',2);
    addLine(0,zero,size,zero,'#c9c0a0',2);
  }

  if(opts.showCorrect){
    const cx = gridToPx(opts.showCorrect.x, gridMin, gridMax, size);
    const cy = size - gridToPx(opts.showCorrect.y, gridMin, gridMax, size);
    const tolPx = (opts.showCorrect.tolerance||0.6) / (gridMax-gridMin) * size;
    const zone = document.createElementNS(svgNS,'circle');
    zone.setAttribute('cx',cx); zone.setAttribute('cy',cy); zone.setAttribute('r',tolPx);
    zone.setAttribute('fill','rgba(96,120,41,0.15)'); zone.setAttribute('stroke','var(--beans)'); zone.setAttribute('stroke-width','1');
    svg.appendChild(zone);
    const cmark = document.createElementNS(svgNS,'circle');
    cmark.setAttribute('cx',cx); cmark.setAttribute('cy',cy); cmark.setAttribute('r','4');
    cmark.setAttribute('fill','var(--beans)');
    svg.appendChild(cmark);
  }

  let marker = null;
  function drawMarker(x,y){
    if(marker) svg.removeChild(marker);
    const px = gridToPx(x, gridMin, gridMax, size);
    const py = size - gridToPx(y, gridMin, gridMax, size);
    marker = document.createElementNS(svgNS,'circle');
    marker.setAttribute('cx',px); marker.setAttribute('cy',py); marker.setAttribute('r','9');
    marker.setAttribute('fill','var(--navy)'); marker.setAttribute('stroke','#fff'); marker.setAttribute('stroke-width','2');
    marker.style.cursor = opts.draggable? 'grab':'default';
    svg.appendChild(marker);
  }
  if(opts.value) drawMarker(opts.value.x, opts.value.y);

  function pickAt(clientX, clientY){
    const rect = svg.getBoundingClientRect();
    const px = ((clientX-rect.left)/rect.width)*size;
    const py = ((clientY-rect.top)/rect.height)*size;
    let gx = pxToGrid(px, gridMin, gridMax, size);
    let gy = pxToGrid(size-py, gridMin, gridMax, size);
    gx = Math.round(gx*2)/2; gy = Math.round(gy*2)/2;
    gx = Math.max(gridMin, Math.min(gridMax, gx));
    gy = Math.max(gridMin, Math.min(gridMax, gy));
    drawMarker(gx,gy);
    if(opts.onPick) opts.onPick(gx,gy);
  }

  let dragging = false;
  function down(e){ dragging=true; const pt=e.touches?e.touches[0]:e; pickAt(pt.clientX, pt.clientY); }
  function move(e){ if(!dragging) return; if(e.cancelable) e.preventDefault(); const pt=e.touches?e.touches[0]:e; pickAt(pt.clientX, pt.clientY); }
  function up(){ dragging=false; }
  svg.addEventListener('mousedown', down);
  svg.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  svg.addEventListener('touchstart', down, {passive:true});
  svg.addEventListener('touchmove', move, {passive:false});
  svg.addEventListener('touchend', up);

  wrap.appendChild(svg);
  return wrap;
}

function evalSliderFunc(funcType, params, x){
  if(funcType==='quadratic') return (params.a||0)*x*x + (params.b||0)*x + (params.c||0);
  return (params.m||0)*x + (params.b||0);
}

function buildSliderGraph(opts){
  const gridMin = opts.gridMin!==undefined?opts.gridMin:-10;
  const gridMax = opts.gridMax!==undefined?opts.gridMax:10;
  const size = 280;
  const wrap = el('div',{style:'width:100%;max-width:320px;'});
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox','0 0 '+size+' '+size);
  svg.setAttribute('width','100%');
  svg.style.background = '#fff';
  svg.style.border = '1px solid var(--border-strong)';
  svg.style.borderRadius = '10px';

  function addLine(x1,y1,x2,y2,stroke,width){
    const l = document.createElementNS(svgNS,'line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1); l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke',stroke); l.setAttribute('stroke-width',width);
    svg.appendChild(l);
  }
  const step = (gridMax-gridMin) <= 12 ? 1 : Math.ceil((gridMax-gridMin)/12);
  for(let v=gridMin; v<=gridMax; v+=step){
    const p = gridToPx(v, gridMin, gridMax, size);
    addLine(p,0,p,size,'#eee0c2',1);
    addLine(0,p,size,p,'#eee0c2',1);
  }
  if(gridMin<=0 && gridMax>=0){
    const zero = gridToPx(0, gridMin, gridMax, size);
    addLine(zero,0,zero,size,'#c9c0a0',2);
    addLine(0,zero,size,zero,'#c9c0a0',2);
  }

  function curvePoints(val){
    const p = Object.assign({}, opts.fixedParams);
    p[opts.sliderParam] = val;
    const pts = [];
    const N = 40;
    for(let i=0;i<=N;i++){
      const x = gridMin + (gridMax-gridMin)*(i/N);
      const y = evalSliderFunc(opts.funcType, p, x);
      const px = gridToPx(x, gridMin, gridMax, size);
      const py = size - gridToPx(y, gridMin, gridMax, size);
      pts.push(px+','+Math.max(-100,Math.min(size+100,py)));
    }
    return pts.join(' ');
  }

  if(opts.showCorrectValue!==undefined){
    const ghost = document.createElementNS(svgNS,'polyline');
    ghost.setAttribute('fill','none'); ghost.setAttribute('stroke','var(--beans)'); ghost.setAttribute('stroke-width','2'); ghost.setAttribute('stroke-dasharray','4,4');
    ghost.setAttribute('points', curvePoints(opts.showCorrectValue));
    svg.appendChild(ghost);
  }

  const curve = document.createElementNS(svgNS,'polyline');
  curve.setAttribute('fill','none'); curve.setAttribute('stroke','var(--navy)'); curve.setAttribute('stroke-width','3');
  svg.appendChild(curve);

  let currentVal = opts.value!==undefined && opts.value!==null ? opts.value : (opts.sliderMin+opts.sliderMax)/2;
  curve.setAttribute('points', curvePoints(currentVal));

  wrap.appendChild(svg);

  const sliderI = el('input',{type:'range',min:opts.sliderMin,max:opts.sliderMax,step:'0.1',style:'width:100%;margin-top:10px;'});
  sliderI.value = currentVal;
  const valLabel = el('div',{class:'muted',style:'text-align:center;margin-top:4px;'}, opts.sliderParam+' = '+currentVal);
  sliderI.oninput = ()=>{
    currentVal = Number(sliderI.value);
    curve.setAttribute('points', curvePoints(currentVal));
    valLabel.textContent = opts.sliderParam+' = '+currentVal;
    if(opts.onChange) opts.onChange(currentVal);
  };
  wrap.appendChild(sliderI);
  wrap.appendChild(valLabel);
  return wrap;
}

function buildDragWidget(q, currentAnswer, onAnswerChange){
  const wrap = el('div',{});
  const initialText = (currentAnswer!==undefined && currentAnswer!==null && q.indexMap.indexOf(currentAnswer)>=0) ? q.displayOptions[q.indexMap.indexOf(currentAnswer)].text : 'Suelta aqui tu respuesta';
  const slot = el('div',{style:'min-height:44px;border:2px dashed var(--border-strong);border-radius:8px;padding:10px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--navy);background:var(--card);text-align:center;'}, initialText);
  const chipsRow = el('div',{style:'display:flex;flex-wrap:wrap;gap:8px;'});
  wrap.appendChild(slot);
  wrap.appendChild(chipsRow);

  q.displayOptions.forEach((opt,oi)=>{
    const origIdx = q.indexMap[oi];
    const chip = el('div',{}, opt.text);
    chip.style.cssText = 'padding:8px 14px;border-radius:20px;background:var(--yellow);color:var(--navy);font-weight:600;cursor:grab;user-select:none;touch-action:none;';
    let dragging=false, clone=null, offsetX=0, offsetY=0;
    function down(e){
      dragging=true;
      const pt = e.touches?e.touches[0]:e;
      const rect = chip.getBoundingClientRect();
      offsetX = pt.clientX-rect.left; offsetY = pt.clientY-rect.top;
      clone = chip.cloneNode(true);
      clone.style.position='fixed'; clone.style.zIndex='999'; clone.style.opacity='0.9'; clone.style.pointerEvents='none';
      clone.style.left=(pt.clientX-offsetX)+'px'; clone.style.top=(pt.clientY-offsetY)+'px';
      clone.style.width = rect.width+'px';
      document.body.appendChild(clone);
      chip.style.opacity = '0.3';
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
      document.addEventListener('touchmove', move, {passive:false});
      document.addEventListener('touchend', up);
    }
    function move(e){
      if(!dragging) return;
      if(e.cancelable) e.preventDefault();
      const pt = e.touches?e.touches[0]:e;
      clone.style.left = (pt.clientX-offsetX)+'px';
      clone.style.top = (pt.clientY-offsetY)+'px';
    }
    function up(e){
      if(!dragging) return;
      dragging=false;
      const pt = e.changedTouches? e.changedTouches[0] : e;
      const slotRect = slot.getBoundingClientRect();
      const inside = pt.clientX>=slotRect.left && pt.clientX<=slotRect.right && pt.clientY>=slotRect.top && pt.clientY<=slotRect.bottom;
      if(clone) document.body.removeChild(clone);
      clone=null;
      chip.style.opacity='1';
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      document.removeEventListener('touchmove', move);
      document.removeEventListener('touchend', up);
      if(inside){
        slot.textContent = opt.text;
        onAnswerChange(origIdx);
      }
    }
    chip.addEventListener('mousedown', down);
    chip.addEventListener('touchstart', down, {passive:true});
    chipsRow.appendChild(chip);
  });
  return wrap;
}

function buildMatchWidget(q, currentAnswer, onAnswerChange){
  const answer = Object.assign({}, currentAnswer||{});
  let selectedLeftIdx = null;
  const wrap = el('div',{class:'row',style:'align-items:flex-start;gap:20px;flex-wrap:nowrap;'});
  const leftCol = el('div',{style:'flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;'});
  const rightCol = el('div',{style:'flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;'});
  const colorPalette = ['#293379','#e5a300','#b81817','#607829','#ee7302'];
  function colorFor(i){ return colorPalette[i % colorPalette.length]; }

  function refresh(){
    leftCol.innerHTML=''; rightCol.innerHTML='';
    q.lefts.forEach((text, li)=>{
      const matched = answer[li]!==undefined;
      const btn = el('div',{}, text);
      btn.style.cssText = 'padding:10px 12px;border-radius:8px;border:2px solid '+(matched?colorFor(li):'var(--border-strong)')+';cursor:pointer;background:'+(selectedLeftIdx===li?'var(--bg)':'#fff')+';font-weight:'+(matched?'700':'400')+';color:'+(matched?colorFor(li):'var(--text)')+';font-size:13px;';
      btn.onclick = ()=>{ selectedLeftIdx = (selectedLeftIdx===li? null : li); refresh(); };
      leftCol.appendChild(btn);
    });
    q.displayRights.forEach((text, di)=>{
      const origIdx = q.rightIndexMap[di];
      let matchedLeft = null;
      Object.keys(answer).forEach(li=>{ if(answer[li]===origIdx) matchedLeft = Number(li); });
      const btn = el('div',{}, text);
      const isMatched = matchedLeft!==null;
      btn.style.cssText = 'padding:10px 12px;border-radius:8px;border:2px solid '+(isMatched?colorFor(matchedLeft):'var(--border-strong)')+';cursor:pointer;background:#fff;font-weight:'+(isMatched?'700':'400')+';color:'+(isMatched?colorFor(matchedLeft):'var(--text)')+';font-size:13px;';
      btn.onclick = ()=>{
        if(selectedLeftIdx===null) return;
        delete answer[selectedLeftIdx];
        Object.keys(answer).forEach(li=>{ if(answer[li]===origIdx) delete answer[li]; });
        answer[selectedLeftIdx] = origIdx;
        selectedLeftIdx = null;
        onAnswerChange(Object.assign({}, answer));
        refresh();
      };
      rightCol.appendChild(btn);
    });
  }
  refresh();
  wrap.appendChild(leftCol); wrap.appendChild(rightCol);
  return wrap;
}

function buildQuestionAnswerWidget(q, currentAnswer, onAnswerChange){
  const wrap = el('div',{});
  const type = q.type||'mc';
  if(type==='short'){
    const shortI = el('input',{type:'text',placeholder:'Escribe tu respuesta'});
    shortI.value = currentAnswer || '';
    shortI.oninput = ()=> onAnswerChange(shortI.value);
    wrap.appendChild(shortI);
  }else if(type==='drag'){
    wrap.appendChild(buildDragWidget(q, currentAnswer, onAnswerChange));
  }else if(type==='point'){
    wrap.appendChild(buildPointGrid({
      gridMin:q.gridMin, gridMax:q.gridMax,
      value: currentAnswer || null,
      draggable:true,
      onPick:(x,y)=> onAnswerChange({x,y})
    }));
    wrap.appendChild(el('p',{class:'muted',style:'margin-top:6px;'},'Toca o arrastra sobre la cuadricula para colocar el punto.'));
  }else if(type==='match'){
    wrap.appendChild(buildMatchWidget(q, currentAnswer, onAnswerChange));
  }else if(type==='slider'){
    wrap.appendChild(buildSliderGraph({
      funcType:q.funcType, fixedParams:q.fixedParams, sliderParam:q.sliderParam,
      sliderMin:q.sliderMin, sliderMax:q.sliderMax, value:currentAnswer,
      gridMin:q.gridMin, gridMax:q.gridMax,
      onChange:(val)=> onAnswerChange(val)
    }));
    wrap.appendChild(el('p',{class:'muted',style:'margin-top:6px;'},'Mueve el control para cambiar la grafica.'));
  }else if(type==='classify'){
    const btnRow = el('div',{class:'row'});
    const trueBtn = el('button',{style:'flex:1;padding:14px;'+(currentAnswer===0?'background:var(--navy);color:#fff;border-color:var(--navy);':'')}, q.labelTrue||'Verdadero');
    trueBtn.onclick = ()=> onAnswerChange(0);
    const falseBtn = el('button',{style:'flex:1;padding:14px;'+(currentAnswer===1?'background:var(--navy);color:#fff;border-color:var(--navy);':'')}, q.labelFalse||'Falso');
    falseBtn.onclick = ()=> onAnswerChange(1);
    btnRow.appendChild(trueBtn); btnRow.appendChild(falseBtn);
    wrap.appendChild(btnRow);
  }else if(type==='multi'){
    const selected = Array.isArray(currentAnswer) ? currentAnswer.slice() : [];
    q.displayOptions.forEach((opt,oi)=>{
      const origIdx = q.indexMap[oi];
      const optRow = el('label',{style:'display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;'});
      const cb = el('input',{type:'checkbox'});
      cb.checked = selected.includes(origIdx);
      cb.onchange = ()=>{
        if(cb.checked){ if(!selected.includes(origIdx)) selected.push(origIdx); }
        else{ const i=selected.indexOf(origIdx); if(i>=0) selected.splice(i,1); }
        onAnswerChange(selected.slice());
      };
      optRow.appendChild(cb);
      if(opt.image) optRow.appendChild(mediaImg(opt.image, {style:'max-width:80px;max-height:60px;border-radius:6px;margin-right:6px;'}));
      optRow.appendChild(document.createTextNode(opt.text));
      wrap.appendChild(optRow);
    });
    wrap.appendChild(el('p',{class:'muted',style:'margin-top:4px;'},'Puedes marcar mas de una opcion.'));
  }else if(type==='order'){
    const arrangement = Array.isArray(currentAnswer) ? currentAnswer.slice() : q.indexMap.slice();
    const list = el('div',{});
    function refresh(){
      list.innerHTML = '';
      arrangement.forEach((origIdx, pos)=>{
        const row = el('div',{class:'list-item row-between',style:'padding:8px 12px;'});
        row.appendChild(el('div',{}, (pos+1)+'. '+q.displayItems[q.indexMap.indexOf(origIdx)]));
        const btns = el('div',{class:'row'});
        const upBtn = el('button',{class:'small ghost'},'↑'); upBtn.disabled = pos===0;
        upBtn.onclick = ()=>{ const t=arrangement[pos-1]; arrangement[pos-1]=arrangement[pos]; arrangement[pos]=t; onAnswerChange(arrangement.slice()); refresh(); };
        const downBtn = el('button',{class:'small ghost'},'↓'); downBtn.disabled = pos===arrangement.length-1;
        downBtn.onclick = ()=>{ const t=arrangement[pos+1]; arrangement[pos+1]=arrangement[pos]; arrangement[pos]=t; onAnswerChange(arrangement.slice()); refresh(); };
        btns.appendChild(upBtn); btns.appendChild(downBtn);
        row.appendChild(btns);
        list.appendChild(row);
      });
    }
    refresh();
    wrap.appendChild(el('p',{class:'muted'},'Usa las flechas para poner los elementos en el orden correcto.'));
    wrap.appendChild(list);
    if(!Array.isArray(currentAnswer)) onAnswerChange(arrangement.slice());
  }else if(type==='interval'){
    const val = Object.assign({leftInf:false, rightInf:false, leftOpen:true, rightOpen:true, leftValue:0, rightValue:0}, currentAnswer||{});
    const row = el('div',{class:'row',style:'align-items:center;flex-wrap:wrap;'});
    const leftBracketSel = el('select',{style:'width:auto;'});
    leftBracketSel.appendChild(el('option',{value:'open'},'('));
    leftBracketSel.appendChild(el('option',{value:'closed'},'['));
    leftBracketSel.appendChild(el('option',{value:'inf'},'-∞ ('));
    leftBracketSel.value = val.leftInf?'inf':(val.leftOpen?'open':'closed');
    const leftInput = el('input',{type:'number',style:'width:70px;'}); leftInput.value = val.leftValue; leftInput.disabled = val.leftInf;
    const commaSpan = el('span',{},',');
    const rightInput = el('input',{type:'number',style:'width:70px;'}); rightInput.value = val.rightValue; rightInput.disabled = val.rightInf;
    const rightBracketSel = el('select',{style:'width:auto;'});
    rightBracketSel.appendChild(el('option',{value:'open'},')'));
    rightBracketSel.appendChild(el('option',{value:'closed'},']'));
    rightBracketSel.appendChild(el('option',{value:'inf'},') ∞'));
    rightBracketSel.value = val.rightInf?'inf':(val.rightOpen?'open':'closed');

    function commit(){
      onAnswerChange({
        leftInf: leftBracketSel.value==='inf', leftOpen: leftBracketSel.value==='open',
        leftValue: Number(leftInput.value)||0,
        rightInf: rightBracketSel.value==='inf', rightOpen: rightBracketSel.value==='open',
        rightValue: Number(rightInput.value)||0
      });
    }
    leftBracketSel.onchange = ()=>{ leftInput.disabled = leftBracketSel.value==='inf'; commit(); };
    rightBracketSel.onchange = ()=>{ rightInput.disabled = rightBracketSel.value==='inf'; commit(); };
    leftInput.oninput = commit; rightInput.oninput = commit;

    row.appendChild(leftBracketSel); row.appendChild(leftInput); row.appendChild(commaSpan); row.appendChild(rightInput); row.appendChild(rightBracketSel);
    wrap.appendChild(row);
    wrap.appendChild(el('p',{class:'muted',style:'margin-top:6px;'},'Elige el tipo de parentesis (abierto/cerrado/infinito) y escribe los valores del intervalo.'));
  }else{
    q.displayOptions.forEach((opt,oi)=>{
      const origIdx = q.indexMap[oi];
      const optRow = el('label',{style:'display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;'});
      const radio = el('input',{type:'radio',name:'qw-'+q.id});
      radio.checked = currentAnswer===origIdx;
      radio.onchange = ()=> onAnswerChange(origIdx);
      optRow.appendChild(radio);
      if(opt.image) optRow.appendChild(mediaImg(opt.image, {style:'max-width:80px;max-height:60px;border-radius:6px;'}));
      optRow.appendChild(document.createTextNode(opt.text));
      wrap.appendChild(optRow);
    });
  }
  return wrap;
}

function buildHintsUI(q, revealedCount, onReveal){
  const wrap = el('div',{style:'margin-top:8px;'});
  const hints = q.hints||[];
  if(hints.length===0) return wrap;
  for(let i=0;i<revealedCount && i<hints.length;i++){
    wrap.appendChild(el('div',{style:'background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:6px;'}, 'Pista '+(i+1)+': '+hints[i]));
  }
  if(revealedCount<hints.length){
    const btn = el('button',{class:'small ghost'}, revealedCount===0?'Ver pista':'Ver otra pista ('+(revealedCount+1)+'/'+hints.length+')');
    btn.onclick = ()=> onReveal(revealedCount+1);
    wrap.appendChild(btn);
  }
  return wrap;
}

function buildShuffledQuestions(act){
  const qOrder = shuffleArray(act.questions);
  return qOrder.map(rawQ=>{
    let q = rawQ;
    if(rawQ.dynamicVars && rawQ.dynamicVars.length>0){
      const values = rollDynamicVars(rawQ.dynamicVars);
      q = JSON.parse(JSON.stringify(rawQ));
      q.text = substitutePlaceholders(q.text, values);
      if(q.note) q.note = substitutePlaceholders(q.note, values);
      if(q.hints) q.hints = q.hints.map(h=>substitutePlaceholders(h, values));
      if(q.type==='short'){
        q.acceptedAnswers = (q.acceptedAnswers||[]).map(a=>substitutePlaceholders(a, values));
      }else if(q.type==='mc'||q.type==='drag'||q.type==='multi'){
        q.options = q.options.map(o=>Object.assign({}, o, {text: substitutePlaceholders(o.text, values)}));
      }
    }
    const type = q.type||'mc';
    const hints = q.hints||[];
    if(type==='short'){
      return { id:q.id, type:'short', text:q.text, note:q.note, image:q.image, points:q.points, hints, acceptedAnswers:q.acceptedAnswers };
    }
    if(type==='point'){
      return { id:q.id, type:'point', text:q.text, note:q.note, image:q.image, points:q.points, hints, gridMin:q.gridMin, gridMax:q.gridMax, correctX:q.correctX, correctY:q.correctY, tolerance:q.tolerance };
    }
    if(type==='slider'){
      return { id:q.id, type:'slider', text:q.text, note:q.note, image:q.image, points:q.points, hints,
        funcType:q.funcType, fixedParams:q.fixedParams, sliderParam:q.sliderParam,
        sliderMin:q.sliderMin, sliderMax:q.sliderMax, correctValue:q.correctValue, tolerance:q.tolerance,
        gridMin:q.gridMin, gridMax:q.gridMax };
    }
    if(type==='match'){
      const rightOrder = shuffleArray(q.pairs.map((_,i)=>i));
      return { id:q.id, type:'match', text:q.text, note:q.note, image:q.image, points:q.points, hints,
        lefts: q.pairs.map(p=>p.left),
        displayRights: rightOrder.map(i=>q.pairs[i].right),
        rightIndexMap: rightOrder /* rightIndexMap[displayPos] = originalPairIndex */
      };
    }
    if(type==='classify'){
      return { id:q.id, type:'classify', text:q.text, note:q.note, image:q.image, points:q.points, hints,
        labelTrue:q.labelTrue||'Verdadero', labelFalse:q.labelFalse||'Falso', correctIndex:q.correctIndex };
    }
    if(type==='interval'){
      return { id:q.id, type:'interval', text:q.text, note:q.note, image:q.image, points:q.points, hints,
        correctLeftValue:q.correctLeftValue, correctRightValue:q.correctRightValue,
        correctLeftOpen:q.correctLeftOpen, correctRightOpen:q.correctRightOpen,
        correctLeftInf:q.correctLeftInf, correctRightInf:q.correctRightInf, tolerance:q.tolerance };
    }
    if(type==='order'){
      const idxs = shuffleArray(q.items.map((_,i)=>i));
      return { id:q.id, type:'order', text:q.text, note:q.note, image:q.image, points:q.points, hints,
        displayItems: idxs.map(i=>q.items[i]), indexMap: idxs };
    }
    if(type==='multi'){
      const optIdx = shuffleArray(q.options.map((_,i)=>i));
      return { id:q.id, type:'multi', text:q.text, note:q.note, image:q.image, points:q.points, hints,
        correctIndexes:q.correctIndexes||[],
        displayOptions: optIdx.map(i=>q.options[i]),
        indexMap: optIdx };
    }
    // mc y drag comparten la misma forma
    const optIdx = shuffleArray(q.options.map((_,i)=>i));
    return {
      id:q.id, type:type, text:q.text, note:q.note, image:q.image, points:q.points, hints, correctIndex:q.correctIndex,
      displayOptions: optIdx.map(i=>q.options[i]),
      indexMap: optIdx
    };
  });
}

function startActivity(cat, act){
  examAccepted = false;
  examExitWarning = false;
  const lockedCorrect = {};
  const initialAnswers = {};
  if(act.type==='work'){
    const subs = (act.submissions && act.submissions[session.username]) || [];
    if(subs.length>0){
      const last = subs[subs.length-1];
      act.questions.forEach(q=>{
        const given = last.answers ? last.answers[q.id] : undefined;
        if(isAnswerCorrect(q, given)){
          lockedCorrect[q.id] = true;
          initialAnswers[q.id] = given;
        }
      });
    }
  }
  takingActivity = { activity:act, categoryId:cat.id, answers:initialAnswers, lockedCorrect, displayQuestions:buildShuffledQuestions(act), hintsRevealed:{} };
  render();
}

function renderTakingActivity(){
  const {activity} = takingActivity;

  if(activity.type==='exam' && !examAccepted){
    root.appendChild(el('div',{class:'content'},[ el('h2',{}, activity.name) ]));
    const modal = el('div',{class:'center-modal'});
    const box = el('div',{class:'modal-box'});
    box.appendChild(el('h2',{}, 'Examen: '+activity.name));
    box.appendChild(el('p',{}, 'Tendras '+(activity.timeLimitMinutes||0)+' minutos para responder. Una vez que aceptes, si sales del examen no podras volver a entrar y se calificara con lo que hayas respondido hasta ese momento.'));
    const row = el('div',{class:'row',style:'justify-content:center;'});
    const cancelBtn = el('button',{},'Cancelar');
    cancelBtn.onclick = ()=>{ takingActivity=null; render(); };
    const acceptBtn = el('button',{class:'primary'},'Aceptar');
    acceptBtn.onclick = ()=>{
      examAccepted = true;
      examTimeLeft = (activity.timeLimitMinutes||10)*60;
      const realAct = findActivity(takingActivity.categoryId, activity.id);
      if(!realAct.inProgress) realAct.inProgress = {};
      realAct.inProgress[session.username] = true;
      saveDB();
      startExamTimer();
      window.onbeforeunload = function(e){ e.preventDefault(); e.returnValue=''; return ''; };
      render();
    };
    row.appendChild(cancelBtn); row.appendChild(acceptBtn);
    box.appendChild(row);
    modal.appendChild(box);
    root.appendChild(modal);
    return;
  }

  if(activity.type==='exam' && examExitWarning){
    root.appendChild(el('div',{class:'content'}));
    const modal = el('div',{class:'center-modal'});
    const box = el('div',{class:'modal-box'});
    box.appendChild(el('h2',{}, 'Vas a salir del examen'));
    box.appendChild(el('p',{}, 'Si sales ahora, no podras volver a entrar a este examen. Se calificara con las respuestas que hayas marcado hasta este momento.'));
    const row = el('div',{class:'row',style:'justify-content:center;'});
    const stayBtn = el('button',{style:'background:var(--navy);border-color:var(--navy);color:#fff;'},'Quedarme');
    stayBtn.onclick = ()=>{ examExitWarning=false; render(); };
    const exitBtn = el('button',{style:'background:#fbe8e7;border-color:#f0c4be;color:var(--danger);'},'Salir y entregar');
    exitBtn.onclick = ()=>{ examExitWarning=false; submitActivity(); };
    row.appendChild(stayBtn); row.appendChild(exitBtn);
    box.appendChild(row);
    modal.appendChild(box);
    root.appendChild(modal);
    return;
  }

  if(activity.type==='exam'){
    const mins = String(Math.floor(examTimeLeft/60)).padStart(2,'0');
    const secs = String(examTimeLeft%60).padStart(2,'0');
    root.appendChild(el('div',{class:'timer'}, mins+':'+secs));
  }

  const content = el('div',{class:'content'});
  const card = el('div',{class:'card'});
  card.appendChild(el('h2',{}, activity.name));
  card.appendChild(el('p',{class:'muted'}, activityTotalPoints(activity)+' puntos totales'));

  takingActivity.displayQuestions.forEach((q, qi)=>{
    const qCard = el('div',{class:'card',style:'background:var(--bg);'});
    const isLockedCorrect = takingActivity.lockedCorrect && takingActivity.lockedCorrect[q.id];
    qCard.appendChild(el('div',{style:'font-weight:700;margin-bottom:6px;'}, (qi+1)+'. '+q.text+' ', el('span',{class:'muted'},'('+q.points+' pts)')));
    if(q.note) qCard.appendChild(el('div',{class:'muted',style:'font-size:12px;margin:-4px 0 6px;'}, q.note));
    if(q.image) qCard.appendChild(mediaImg(q.image, {style:'max-width:100%;border-radius:8px;margin-top:8px;display:block;'}));
    if(isLockedCorrect){
      const correctText = correctTextForDisplayQuestion(q);
      qCard.appendChild(el('div',{style:'color:var(--success);font-weight:700;padding:6px 0;'}, '✓ Correcta: '+correctText));
    }else{
      qCard.appendChild(buildQuestionAnswerWidget(q, takingActivity.answers[q.id], (val)=>{ takingActivity.answers[q.id] = val; }));
      qCard.appendChild(buildHintsUI(q, takingActivity.hintsRevealed[q.id]||0, (n)=>{ takingActivity.hintsRevealed[q.id]=n; render(); }));
    }
    card.appendChild(qCard);
  });

  const submitBtn = el('button',{class:'primary'},'Entregar actividad');
  submitBtn.onclick = ()=> submitActivity();
  card.appendChild(submitBtn);
  const cancelBtn = el('button',{style:'margin-left:8px;'}, activity.type==='exam' ? 'Salir del examen' : 'Cancelar');
  cancelBtn.onclick = ()=>{
    if(activity.type==='exam'){
      examExitWarning = true;
      render();
    }else{
      takingActivity=null; render();
    }
  };
  card.appendChild(cancelBtn);

  content.appendChild(card);
  root.appendChild(content);
}

function startExamTimer(){
  if(examTimerInterval) clearInterval(examTimerInterval);
  examTimerInterval = setInterval(()=>{
    examTimeLeft--;
    if(examTimeLeft<=0){
      clearInterval(examTimerInterval); examTimerInterval=null;
      submitActivity();
      return;
    }
    const timerEl = document.querySelector('.timer');
    if(timerEl){
      const mins = String(Math.floor(examTimeLeft/60)).padStart(2,'0');
      const secs = String(examTimeLeft%60).padStart(2,'0');
      timerEl.textContent = mins+':'+secs;
    }
  },1000);
}

function submitActivity(){
  if(examTimerInterval){ clearInterval(examTimerInterval); examTimerInterval=null; }
  window.onbeforeunload = null;
  const {activity, categoryId, answers} = takingActivity;
  let score = 0;
  activity.questions.forEach(q=>{ if(isAnswerCorrect(q, answers[q.id])) score += Number(q.points)||0; });
  const total = activityTotalPoints(activity);
  const pct = total>0 ? Math.round((score/total)*100) : 0;

  const realAct = findActivity(categoryId, activity.id);
  if(!realAct.submissions) realAct.submissions = {};
  if(!realAct.submissions[session.username]) realAct.submissions[session.username] = [];
  realAct.submissions[session.username].push({ score, total, pct, answers: Object.assign({}, answers), timestamp: Date.now() });
  saveDB();

  resultView = { name: activity.name, score, total, pct };
  takingActivity = null;
  examExitWarning = false;
  render();
}

function renderResult(){
  const content = el('div',{class:'content'});
  const card = el('div',{class:'card',style:'text-align:center;max-width:340px;margin:60px auto;'});
  card.appendChild(el('h2',{}, resultView.name));
  card.appendChild(el('p',{class:'muted'},'Calificacion obtenida'));
  card.appendChild(el('div',{class:'badge-score'}, resultView.pct+'%'));
  card.appendChild(el('p',{class:'muted'}, resultView.score+' de '+resultView.total+' puntos'));
  const btn = el('button',{class:'primary',style:'margin-top:16px;'},'Volver a mis actividades');
  btn.onclick = ()=>{ resultView=null; studentTab='activities'; saveSession(); render(); };
  card.appendChild(btn);
  content.appendChild(card);
  root.appendChild(content);
}

/* ---------- Inicio ---------- */
(async function init(){
  await loadDB();
  restoreSession();
  resetIdleTimer();
  render();
})();
</script>
</body>
</html>
